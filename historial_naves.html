<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ElDesierto - Historial de Naves</title><style>
*{box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#1d1d1d,#050505 65%);
color:white;margin:0;padding:20px;min-height:100vh
}

h1{
text-align:center;color:#ff3030;font-size:32px;margin:10px 0 25px;
text-shadow:0 0 10px rgba(255,0,0,.6)
}

h2{color:#ff5555}

.boton{
display:block;width:90%;max-width:500px;margin:15px auto;padding:16px;
background:linear-gradient(145deg,#ff3838,#9d0000);color:white;border:none;
border-radius:14px;font-size:17px;font-weight:bold;cursor:pointer;
box-shadow:0 7px 0 #500000,0 12px 25px rgba(255,0,0,.18);transition:.2s
}

.boton:active{transform:translateY(5px);box-shadow:0 2px 0 #500000}

.estadisticas{
width:95%;max-width:1100px;margin:25px auto;display:grid;
grid-template-columns:repeat(5,1fr);gap:15px
}

.estadistica{
padding:20px 12px;border-radius:18px;text-align:center;
background:linear-gradient(145deg,#242424,#090909);
border:1px solid #3b3b3b;
box-shadow:8px 8px 18px #000,-3px -3px 10px #252525
}

.estadistica .icono{font-size:30px;margin-bottom:8px}
.estadistica .titulo{font-size:13px;color:#aaa;margin-bottom:8px}
.estadistica .numero{
font-size:28px;font-weight:bold;color:#ff4040;
text-shadow:0 0 10px rgba(255,0,0,.4)
}

.filtros{
width:95%;max-width:1100px;margin:25px auto;padding:20px;border-radius:20px;
background:linear-gradient(145deg,#202020,#080808);border:1px solid #3a3a3a;
box-shadow:8px 8px 25px #000
}

.filtros h2{text-align:center;margin-top:0}

.contenedorFiltros{
display:grid;grid-template-columns:repeat(4,1fr);gap:12px
}

select,input{
width:100%;padding:14px;border-radius:12px;border:1px solid #444;
background:#101010;color:white;font-size:15px;outline:none
}

select:focus,input:focus{
border-color:#ff3030;box-shadow:0 0 10px rgba(255,0,0,.3)
}

.botonFiltro{
padding:14px;border:none;border-radius:12px;font-weight:bold;color:white;
cursor:pointer;background:linear-gradient(145deg,#e50000,#850000);
box-shadow:0 5px 0 #480000
}

.botonFiltro:active{
transform:translateY(4px);box-shadow:0 1px 0 #480000
}

.caja{
width:100%;max-width:1300px;margin:25px auto;padding:20px;border-radius:20px;
background:linear-gradient(145deg,#202020,#080808);border:1px solid #3a3a3a;
box-shadow:10px 10px 25px #000,-3px -3px 15px #252525;overflow-x:auto
}

table{
width:100%;min-width:1100px;border-collapse:separate;border-spacing:0 8px
}

th{
padding:14px 10px;color:#ff5555;
background:linear-gradient(145deg,#2a0000,#120000)
}

td{
padding:14px 10px;text-align:center;
background:linear-gradient(145deg,#202020,#111);color:#eee
}

td:first-child{border-radius:12px 0 0 12px}
td:last-child{border-radius:0 12px 12px 0}
tbody tr:hover td{background:#292929}

.eliminar{
padding:10px 14px;border:none;border-radius:10px;color:white;font-weight:bold;
cursor:pointer;background:linear-gradient(145deg,#ff2424,#820000);
box-shadow:0 4px 0 #480000
}

.eliminar:active{
transform:translateY(3px);box-shadow:0 1px 0 #480000
}

.sinPermiso{color:#777}

.mensaje{
text-align:center;padding:30px;font-size:17px;font-weight:bold;color:#ff5555
}

.grupo{
display:inline-block;
margin:3px;
padding:5px 8px;
border-radius:7px;
background:#300000;
border:1px solid #750000;
color:#ff7777;
font-weight:bold;
}

@media(max-width:850px){
.estadisticas{grid-template-columns:repeat(2,1fr)}
.contenedorFiltros{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:500px){
body{padding:12px}
h1{font-size:27px}
.estadisticas{grid-template-columns:1fr}
.contenedorFiltros{grid-template-columns:1fr}
}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><h1>📜 Historial de Naves</h1><button class="boton" onclick="window.location.href='naves.html'">
⬅️ Volver a Naves
</button><div class="estadisticas"><div class="estadistica">
<div class="icono">➕🐷</div>
<div class="titulo">CERDOS INGRESADOS</div>
<div class="numero" id="totalEntradas">0</div>
</div><div class="estadistica">
<div class="icono">💰</div>
<div class="titulo">CERDOS VENDIDOS</div>
<div class="numero" id="totalVentas">0</div>
</div><div class="estadistica">
<div class="icono">☠️</div>
<div class="titulo">MUERTES</div>
<div class="numero" id="totalMuertes">0</div>
</div><div class="estadistica">
<div class="icono">⚖️</div>
<div class="titulo">MUERTES DE VENTA</div>
<div class="numero" id="totalMuertesVenta">0</div>
</div><div class="estadistica">
<div class="icono">📊</div>
<div class="titulo">MOVIMIENTOS</div>
<div class="numero" id="totalMovimientos">0</div>
</div></div><div class="filtros"><h2>🔎 Filtrar historial</h2><div class="contenedorFiltros"><select id="filtroNave">
<option value="">🏠 Todas las naves</option>
</select><select id="filtroMotivo"><option value="">📋 Todas las operaciones</option><option value="Entrada Destete">🍼 Entrada Destete</option><option value="Entrada Exterior">🚚 Entrada Exterior</option><option value="Venta">💰 Ventas</option><option value="Muerte total">☠️ Muerte total</option><option value="Muerte de venta">⚖️ Muerte de venta</option></select><input type="date" id="filtroFecha"><button class="botonFiltro" onclick="aplicarFiltros">
🔎 Buscar
</button></div><button
class="botonFiltro"
style="width:100%;margin-top:15px;"
onclick="limpiarFiltros()">
🔄 Limpiar filtros
</button>

</div><div class="caja"><table><thead><tr>
<th>📅 Fecha</th>
<th>🕒 Hora</th>
<th>🏠 Nave</th>
<th>🐷 Cuartón</th>
<th>📦 Operación</th>
<th>🔢 Cantidad</th>
<th>⚖️ Peso kg</th>
<th>📋 Motivo</th>
<th>👤 Usuario</th>
<th>⚙️ Acción</th>
</tr></thead><tbody id="tablaHistorial"><tr>
<td colspan="10" class="mensaje">
⏳ Cargando historial...
</td>
</tr></tbody></table></div><button class="boton" onclick="window.location.href='menu.html'">
⬅️ Volver al menú
</button><script src="supabase.js"></script><script>

let esAdministrador=false;
let todosLosMovimientos=[];


/* SESIÓN */

async function verificarSesion(){

const {data,error}=await clienteSupabase.auth.getSession();

if(error||!data.session){
window.location.href="login.html";
return false;
}

const usuarioId=data.session.user.id;

const {data:perfil,error:errorPerfil}=await clienteSupabase
.from("perfiles")
.select("id,rol")
.eq("id",usuarioId)
.maybeSingle();

if(errorPerfil){
alert("Error buscando perfil:\n\n"+errorPerfil.message);
return false;
}

if(!perfil){
alert("⚠️ Este usuario no tiene un perfil.");
return false;
}

esAdministrador=
String(perfil.rol||"").trim().toLowerCase()==="administrador";

return true;
}


/* NAVES */

async function cargarNavesFiltro(){

const {data,error}=await clienteSupabase
.from("naves").select("*").order("id");

if(error){
console.log(error);
return;
}

const select=document.getElementById("filtroNave");

(data||[]).forEach(nave=>{

select.innerHTML+=`
<option value="${nave.id}">
${nave.nombre}
</option>
`;

});

}


/* HISTORIAL */

async function cargarHistorial(){

const tabla=document.getElementById("tablaHistorial");

tabla.innerHTML=`
<tr>
<td colspan="10" class="mensaje">
⏳ Cargando historial...
</td>
</tr>
`;

const {data,error}=await clienteSupabase
.from("movimientos_naves")
.select("*")
.order("fecha",{ascending:false});

if(error){

tabla.innerHTML=`
<tr>
<td colspan="10" class="mensaje">
❌ Error cargando historial:<br><br>
${escapeHTML(error.message)}
</td>
</tr>
`;

return;
}

todosLosMovimientos=data||[];

mostrarHistorial(todosLosMovimientos);
}


/* MOSTRAR */

function mostrarHistorial(movimientos){

const tabla=document.getElementById("tablaHistorial");

actualizarEstadisticas(movimientos);

if(!movimientos||movimientos.length===0){

tabla.innerHTML=`
<tr>
<td colspan="10" class="mensaje">
📭 No hay movimientos para mostrar.
</td>
</tr>
`;

return;
}

let html="";

movimientos.forEach(m=>{

const fechaCompleta=new Date(m.fecha);

const fecha=fechaCompleta.toLocaleDateString("es-ES");

const hora=fechaCompleta.toLocaleTimeString(
"es-ES",
{hour:"2-digit",minute:"2-digit"}
);

const nave=m.nave||"N"+m.nave_id;

const peso=Number(m.peso_kg||0);

const esGrupo=
String(m.nave||"").includes(",")||
String(m.cuarton||"").includes(",");

const naveHTML=formatearLista(m.nave||("N"+m.nave_id));
const cuartonHTML=formatearLista(m.cuarton);

const botonEliminar=esAdministrador
?
`
<button
class="eliminar"
onclick="eliminarMovimiento(${m.id})">
🗑️ Eliminar
</button>
`
:
`
<span class="sinPermiso">
🔒 Sin permiso
</span>
`;

html+=`

<tr>

<td>${fecha}</td>

<td>${hora}</td>

<td>${naveHTML}</td>

<td>${cuartonHTML}</td>

<td>
${escapeHTML(m.operacion||"")}
${esGrupo?"<br><small style='color:#ff5555;'>Venta grupal</small>":""}
</td>

<td>
<strong>${m.cantidad||0}</strong>
</td>

<td>
${peso>0?peso.toFixed(2):"—"}
</td>

<td>
${escapeHTML(m.motivo||"")}
</td>

<td>
${escapeHTML(m.usuario||"")}
</td>

<td>
${botonEliminar}
</td>

</tr>
`;

});

tabla.innerHTML=html;
}


/* ESTADÍSTICAS */

function actualizarEstadisticas(movimientos){

let entradas=0;
let ventas=0;
let muertes=0;
let muertesVenta=0;

(movimientos||[]).forEach(m=>{

const cantidad=Number(m.cantidad||0);

const motivo=
String(m.motivo||"")
.trim()
.toLowerCase();

if(motivo==="entrada destete"||
motivo==="entrada exterior"){
entradas+=cantidad;
}

if(motivo==="venta"){
ventas+=cantidad;
}

if(motivo==="muerte total"){
muertes+=cantidad;
}

if(motivo==="muerte de venta"){
muertesVenta+=cantidad;
}

});

document.getElementById("totalEntradas").innerText=entradas;
document.getElementById("totalVentas").innerText=ventas;
document.getElementById("totalMuertes").innerText=muertes;
document.getElementById("totalMuertesVenta").innerText=muertesVenta;
document.getElementById("totalMovimientos").innerText=
(movimientos||[]).length;
}


/* FILTROS */

function aplicarFiltros(){

const nave=document.getElementById("filtroNave").value;
const motivo=document.getElementById("filtroMotivo").value;
const fecha=document.getElementById("filtroFecha").value;

let resultado=[...todosLosMovimientos];

if(nave){

resultado=resultado.filter(m=>
String(m.nave_id)===String(nave)||
String(m.nave||"").split(",").some(n=>
String(n).trim()==="N"+nave||
String(n).trim()===obtenerNombreNavePorId(nave)
)
);

}

if(motivo){

resultado=resultado.filter(m=>
String(m.motivo||"").trim()===motivo
);

}

if(fecha){

resultado=resultado.filter(m=>{

const d=new Date(m.fecha);

const local=
d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

return local===fecha;

});

}

mostrarHistorial(resultado);
}


/* LIMPIAR */

function limpiarFiltros(){

document.getElementById("filtroNave").value="";
document.getElementById("filtroMotivo").value="";
document.getElementById("filtroFecha").value="";

mostrarHistorial(todosLosMovimientos);
}


/* ELIMINAR */

async function eliminarMovimiento(id){

if(!esAdministrador){

alert("❌ No tienes permisos para eliminar registros.");
return;

}

if(!confirm(
"⚠️ ¿Seguro que deseas eliminar este registro?\n\n"+
"Esta acción no se puede deshacer."
)){
return;
}

const {error}=await clienteSupabase
.from("movimientos_naves")
.delete()
.eq("id",id);

if(error){

alert(
"❌ Error eliminando el registro:\n\n"+
error.message
);

return;
}

alert("✅ Registro eliminado correctamente.");

await cargarHistorial();
}


/* UTILIDADES */

function formatearLista(valor){

if(!valor)return "—";

const partes=String(valor)
.split(",");

if(partes.length===1){

const texto=String(partes[0]).trim();

return texto.startsWith("C")
?escapeHTML(texto)
:escapeHTML(texto);
}

return partes.map(x=>
`<span class="grupo">${escapeHTML(String(x).trim())}</span>`
).join("");
}


function obtenerNombreNavePorId(id){

const select=document.getElementById("filtroNave");

const opcion=
Array.from(select.options)
.find(o=>String(o.value)===String(id));

return opcion?opcion.textContent.trim():"";
}


function escapeHTML(valor){

return String(valor)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* INICIAR */

async function iniciar(){

const ok=await verificarSesion();

if(!ok)return;

await cargarNavesFiltro();
await cargarHistorial();

}

iniciar();

</script></body>
</html>
