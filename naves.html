<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Naves - ElDesierto</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#2b0000 0%,#100000 35%,#050505 75%);
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    color:#ff2020;
    font-size:32px;
    margin-bottom:20px;
    text-shadow:0 0 12px #ff0000;
}

.menu-btn{
    display:block;
    margin:0 auto 20px;
    padding:12px 25px;
    border:none;
    border-radius:12px;
    background:linear-gradient(145deg,#ff2020,#8b0000);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(255,0,0,.35);
}

.menu-btn:hover{
    transform:scale(1.03);
}

#contenido{
    max-width:1100px;
    margin:auto;
}

.nave{
    margin-bottom:25px;
    padding:20px;
    border-radius:20px;
    background:linear-gradient(145deg,#181818,#080808);
    border:1px solid #3a0000;
    box-shadow:
        0 8px 25px rgba(0,0,0,.7),
        inset 0 0 15px rgba(255,0,0,.05);
}

.nave h2{
    color:#ff2525;
    margin-bottom:15px;
    text-shadow:0 0 8px #ff0000;
}

.total-nave{
    margin-bottom:15px;
    font-size:17px;
    color:#ddd;
}

.cuartones{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(105px,1fr));
    gap:10px;
}

.cuarton{
    padding:15px 8px;
    border-radius:14px;
    background:linear-gradient(145deg,#202020,#090909);
    border:1px solid #3b0000;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 4px 10px rgba(0,0,0,.5);
}

.cuarton:hover{
    transform:translateY(-3px);
    border-color:#ff2020;
    box-shadow:0 0 15px rgba(255,0,0,.25);
}

.cuarton .numero{
    font-size:17px;
    color:#ff3030;
    font-weight:bold;
}

.cuarton .cantidad{
    margin-top:7px;
    font-size:22px;
    font-weight:bold;
}

.resumen{
    margin-top:20px;
    padding:20px;
    border-radius:18px;
    background:linear-gradient(145deg,#181818,#080808);
    border:1px solid #350000;
}

.resumen h2{
    color:#ff2424;
    margin-bottom:15px;
}

.resumen-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.resumen-card{
    padding:15px;
    border-radius:12px;
    background:#111;
    border:1px solid #300000;
}

.resumen-card strong{
    display:block;
    color:#aaa;
    margin-bottom:5px;
}

.resumen-card span{
    color:#ff2525;
    font-size:24px;
    font-weight:bold;
}

.panel{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:1000;
}

.panel-contenido{
    width:100%;
    max-width:430px;
    max-height:90vh;
    overflow-y:auto;
    padding:25px;
    border-radius:22px;
    background:linear-gradient(145deg,#1b1b1b,#070707);
    border:1px solid #4a0000;
    box-shadow:
        0 0 30px rgba(255,0,0,.2),
        0 15px 50px rgba(0,0,0,.9);
}

.panel-contenido h2{
    text-align:center;
    color:#ff2525;
    margin-bottom:20px;
}

.panel-contenido p{
    color:#ddd;
    line-height:1.5;
    margin-bottom:15px;
    text-align:center;
}

input,
select{
    width:100%;
    padding:13px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #450000;
    background:#101010;
    color:white;
    outline:none;
    font-size:16px;
}

input:focus,
select:focus{
    border-color:#ff2020;
    box-shadow:0 0 8px rgba(255,0,0,.2);
}

button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:none;
    border-radius:11px;
    background:linear-gradient(145deg,#ff2020,#870000);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.12);
}

button.secundario{
    background:linear-gradient(145deg,#333,#151515);
    border:1px solid #444;
}

button.peligro{
    background:linear-gradient(145deg,#d00000,#550000);
}

button.exito{
    background:linear-gradient(145deg,#a50000,#550000);
}

.oculto{
    display:none !important;
}

.grupo-lista{
    margin-top:12px;
    max-height:220px;
    overflow-y:auto;
}

.grupo-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    margin-bottom:8px;
    border-radius:10px;
    background:#111;
    border:1px solid #300000;
}

.grupo-item label{
    flex:1;
}

.grupo-item input{
    width:auto;
    margin:0;
}

.info-origen{
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
    background:#101010;
    border:1px solid #450000;
    color:#ff3030;
    text-align:center;
    font-weight:bold;
}

@media(max-width:600px){

    body{
        padding:12px;
    }

    h1{
        font-size:27px;
    }

    .nave{
        padding:14px;
    }

    .cuartones{
        grid-template-columns:repeat(3,1fr);
    }

    .cuarton{
        padding:12px 5px;
    }

    .cuarton .cantidad{
        font-size:19px;
    }

}

</style>

</head>

<body>

<h1>🐷 Naves</h1>

<button class="menu-btn" onclick="window.location.href='menu.html'">
    ⬅ Volver al menú
</button>

<div id="contenido">
    <p style="text-align:center;color:#aaa;">Cargando naves...</p>
</div>


<!-- =========================================
     PANEL CUARTÓN
========================================= -->

<div id="panelCuarton" class="panel oculto">

    <div class="panel-contenido">

        <h2 id="tituloCuarton">Cuartón</h2>

        <div class="info-origen">
            🐷 Cerdos actuales:
            <span id="cantidadCuarton">0</span>
        </div>

        <button onclick="mostrarAgregar()">
            ➕ Agregar cerdos
        </button>

        <button onclick="mostrarSalida()">
            ➖ Sacar cerdos
        </button>

        <button class="secundario" onclick="cerrarPanel()">
            Cancelar
        </button>

    </div>

</div>


<!-- =========================================
     PANEL ENTRADA
========================================= -->

<div id="panelEntrada" class="panel oculto">

    <div class="panel-contenido">

        <h2>Agregar cerdos</h2>

        <button onclick="mostrarCantidadEntrada('Destete')">
            🐷 Entrada por destete
        </button>

        <button onclick="mostrarCantidadEntrada('Exterior')">
            🚚 Entrada del exterior
        </button>

        <button class="secundario" onclick="cerrarPanel()">
            Cancelar
        </button>

    </div>

</div>


<!-- =========================================
     PANEL CANTIDAD ENTRADA
========================================= -->

<div id="panelAgregar" class="panel oculto">

    <div class="panel-contenido">

        <h2 id="tituloAgregar">Agregar cerdos</h2>

        <input
            id="cantidadAgregar"
            type="number"
            min="1"
            placeholder="Cantidad de cerdos"
        >

        <button onclick="agregarCerdos()">
            💾 Guardar
        </button>

        <button class="secundario" onclick="cerrarPanel()">
            Cancelar
        </button>

    </div>

</div>


<!-- =========================================
     PANEL MOTIVO SALIDA
========================================= -->

<div id="panelMotivo" class="panel oculto">

    <div class="panel-contenido">

        <h2>Tipo de salida</h2>

        <button onclick="mostrarVenta()">
            💰 Venta
        </button>

        <button onclick="mostrarMuerte()">
            ☠️ Muerte
        </button>

        <button onclick="mostrarReagrupeSalida()">
            🔄 Reagrupación
        </button>

        <button class="secundario" onclick="cerrarPanel()">
            Cancelar
        </button>

    </div>

</div>


<!-- =========================================
     PANEL VENTA
========================================= -->

<div id="panelVenta" class="panel oculto">

    <div class="panel-contenido">

        <h2>💰 Venta de cerdos</h2>

        <input
            id="cantidadVenta"
            type="number"
            min="1"
            placeholder="Cantidad de cerdos"
        >

        <input
            id="pesoVenta"
            type="number"
            min="0"
            step="0.01"
            placeholder="Peso total (kg)"
        >

        <button onclick="procesarVenta()">
            Confirmar venta
        </button>

        <button class="secundario" onclick="mostrarVentaGrupo()">
            Venta de varios cuartones
        </button>

        <button class="secundario" onclick="cerrarPanel()">
            Cancelar
        </button>

    </div>

</div>


<!-- =========================================
     PANEL VENTA GRUPO
========================================= -->

<div id="panelVentaGrupo" class="panel oculto">

    <div class="panel-contenido">

        <h2>💰 Venta de varios cuartones</h2>

        <select id="grupoNaveSeleccionada"
                onchange="cargarCuartonesGrupo()">
            <option value="">Seleccione una nave</option>
        </select>

        <div id="grupoCuartones"
             class="grupo-lista"></div>

        <input
            id="pesoVentaGrupo"
            type="number"
            min="0"
            step="0.01"
            placeholder="Peso total (kg)"
        >

        <button onclick="procesarVentaGrupo()">
            Confirmar venta grupal
        </button>

        <button class="secundario" onclick="mostrarVenta()">
            Volver
        </button>

        <button class="secundario" onclick="cerrarPanel()">
            Cancelar
        </button>

    </div>

</div>


<!-- =========================================
     PANEL MUERTE
========================================= -->

<div id="panelMuerte" class="panel oculto">

    <div class="panel-contenido">

        <h2>☠️ Registrar muerte</h2>

        <button onclick="mostrarMuerteTotal()">
            Muerte sin peso
        </button>

        <button onclick="mostrarMuerteVenta()">
            Muerte con peso
        </button>

        <button class="secundario" onclick="cerrarPanel()">
            Cancelar
        </button>

    </div>

</div>


<!-- =========================================
     PANEL MUERTE TOTAL
========================================= -->

<div id="panelMuerteTotal" class="panel oculto">

    <div class="panel-contenido">

        <h2>☠️ Muerte</h2>

        <input
            id="cantidadMuerteTotal"
            type="number"
            min="1"
            placeholder="Cantidad de cerdos"
        >

        <button class="peligro" onclick="procesarMuerteTotal()">
            Registrar muerte
        </button>

        <button class="secundario" onclick="cerrarPanel()">
            Cancelar
        </button>

    </div>

</div>


<!-- =========================================
     PANEL MUERTE CON PESO
========================================= -->

<div id="panelMuerteVenta" class="panel oculto">

    <div class="panel-contenido">

        <h2>☠️ Muerte con peso</h2>

        <input
            id="cantidadMuerteVenta"
            type="number"
            min="1"
            placeholder="Cantidad de cerdos"
        >

        <input
            id="pesoMuerteVenta"
            type="number"
            min="0"
            step="0.01"
            placeholder="Peso total (kg)"
        >

        <button class="peligro" onclick="procesarMuerteVenta()">
            Registrar muerte
        </button>

        <button class="secundario" onclick="cerrarPanel()">
            Cancelar
        </button>

    </div>

</div>


<!-- =========================================
     PANEL REAGRUPACIÓN
========================================= -->

<div id="panelReagrupeSalida" class="panel oculto">

    <div class="panel-contenido">

        <h2>🔄 Reagrupación</h2>

        <div class="info-origen">

            <div id="origenReagrupeTexto">
                —
            </div>

        </div>

        <input
            id="cantidadReagrupe"
            type="number"
            min="1"
            placeholder="Cantidad de cerdos"
        >

        <select id="cuartonDestinoSalida">
            <option value="">
                Seleccione cuartón destino
            </option>
        </select>

        <button onclick="procesarReagrupe()">
            🔄 Confirmar reagrupación
        </button>

        <button class="secundario" onclick="cerrarPanel()">
            Cancelar
        </button>

    </div>

</div>


<script>

/* ==================================================
   VARIABLES
================================================== */

let naveSeleccionada = null;
let cuartonSeleccionado = null;

let tipoEntradaSeleccionado = null;

let todasLasNaves = [];
let todosLosCuartones = [];

let ventaGrupo = [];


/* ==================================================
   VERIFICAR SESIÓN
================================================== */

async function verificarSesion(){

    const {data} =
        await clienteSupabase.auth.getSession();

    if(!data.session){

        window.location.href="login.html";

        return false;
    }

    return true;
}


/* ==================================================
   CARGAR NAVES
================================================== */

async function cargarNaves(){

    const contenido =
        document.getElementById("contenido");

    contenido.innerHTML =
        "<p style='text-align:center;color:#aaa;'>Cargando naves...</p>";

    const {data:naves,error:errorNaves} =
        await clienteSupabase
        .from("naves")
        .select("*")
        .order("id",{ascending:true});

    if(errorNaves){

        console.error(errorNaves);

        contenido.innerHTML =
            "<p style='text-align:center;color:#f33;'>Error cargando naves</p>";

        return;
    }

    todasLasNaves = naves || [];
    todosLosCuartones = [];

    contenido.innerHTML = "";

    let totalGeneral = 0;

    for(const nave of todasLasNaves){

        const {data:cuartones,error:errorCuartones} =
            await clienteSupabase
            .from("cuartones")
            .select("*")
            .eq("nave_id",nave.id)
            .order("numero",{ascending:true});

        if(errorCuartones){

            console.error(errorCuartones);

            continue;
        }

        const lista = cuartones || [];

        let totalNave = 0;

        lista.forEach(c=>{

            totalNave += Number(c.cantidad_cerdos || 0);

            totalGeneral += Number(c.cantidad_cerdos || 0);

            todosLosCuartones.push({

                ...c,

                nave_nombre:nave.nombre

            });

        });

        const divNave =
            document.createElement("div");

        divNave.className="nave";

        divNave.innerHTML = `

            <h2>🐷 ${nave.nombre}</h2>

            <div class="total-nave">
                Total de cerdos:
                <strong>${totalNave}</strong>
            </div>

            <div class="cuartones"></div>

        `;

        const contenedorCuartones =
            divNave.querySelector(".cuartones");

        lista.forEach(c=>{

            const div =
                document.createElement("div");

            div.className="cuarton";

            div.innerHTML = `

                <div class="numero">
                    C${c.numero}
                </div>

                <div class="cantidad">
                    ${Number(c.cantidad_cerdos || 0)}
                </div>

            `;

            div.onclick=()=>{

                seleccionarCuarton(
                    nave.id,
                    c.id,
                    nave.nombre,
                    c.numero,
                    c.cantidad_cerdos
                );

            };

            contenedorCuartones.appendChild(div);

        });

        contenido.appendChild(divNave);

    }

    /* ==============================================
       RESUMEN
    ============================================== */

    const hoy =
        new Date().toISOString().split("T")[0];

    const {data:movimientos,error:errorMovimientos} =
        await clienteSupabase
        .from("movimientos_naves")
        .select("*")
        .gte("fecha",hoy+"T00:00:00")
        .lt("fecha",hoy+"T23:59:59");

    if(errorMovimientos){

        console.error(errorMovimientos);

    }

    let ventas = 0;
    let pesoVentas = 0;

    let muertes = 0;
    let pesoMuertes = 0;

    (movimientos || []).forEach(m=>{

        if(
            m.operacion==="Salida" &&
            m.motivo==="Venta"
        ){

            ventas += Number(m.cantidad || 0);

            pesoVentas += Number(m.peso_kg || 0);

        }

        if(
            m.operacion==="Salida" &&
            (
                m.motivo==="Muerte total" ||
                m.motivo==="Muerte de venta"
            )
        ){

            muertes += Number(m.cantidad || 0);

            pesoMuertes += Number(m.peso_kg || 0);

        }

    });

    contenido.insertAdjacentHTML(
        "beforeend",

        `

        <div class="resumen">

            <h2>📊 Resumen de hoy</h2>

            <div class="resumen-grid">

                <div class="resumen-card">

                    <strong>Cerdos actuales</strong>

                    <span>${totalGeneral}</span>

                </div>

                <div class="resumen-card">

                    <strong>Cerdos vendidos</strong>

                    <span>${ventas}</span>

                </div>

                <div class="resumen-card">

                    <strong>Peso vendido</strong>

                    <span>${pesoVentas.toFixed(2)} kg</span>

                </div>

                <div class="resumen-card">

                    <strong>Cerdos muertos</strong>

                    <span>${muertes}</span>

                </div>

                <div class="resumen-card">

                    <strong>Peso de muertes</strong>

                    <span>${pesoMuertes.toFixed(2)} kg</span>

                </div>

            </div>

        </div>

        `

    );

    await cargarOpcionesCuartones();
    await cargarNavesVentaGrupo();

}


/* ==================================================
   OPCIONES DE CUARTONES PARA DESTINO
================================================== */

async function cargarOpcionesCuartones(){

    const select =
        document.getElementById(
            "cuartonDestinoSalida"
        );

    if(!select) return;

    select.innerHTML =
        `<option value="">Seleccione cuartón destino</option>`;

    for(const nave of todasLasNaves){

        const cuartones =
            todosLosCuartones.filter(
                c=>Number(c.nave_id)===Number(nave.id)
            );

        if(!cuartones.length) continue;

        const grupo =
            document.createElement("optgroup");

        grupo.label=nave.nombre;

        cuartones.forEach(c=>{

            const option =
                document.createElement("option");

            option.value=c.id;

            option.textContent =
                `C${c.numero} — ${Number(c.cantidad_cerdos || 0)} cerdos`;

            grupo.appendChild(option);

        });

        select.appendChild(grupo);

    }

}


/* ==================================================
   OPCIONES VENTA GRUPO
================================================== */

async function cargarNavesVentaGrupo(){

    const select =
        document.getElementById(
            "grupoNaveSeleccionada"
        );

    if(!select) return;

    select.innerHTML =
        `<option value="">Seleccione una nave</option>`;

    todasLasNaves.forEach(nave=>{

        const option =
            document.createElement("option");

        option.value=nave.id;

        option.textContent=nave.nombre;

        select.appendChild(option);

    });

}


/* ==================================================
   CARGAR CUARTONES GRUPO
================================================== */

function cargarCuartonesGrupo(){

    const naveId =
        Number(
            document.getElementById(
                "grupoNaveSeleccionada"
            ).value
        );

    const contenedor =
        document.getElementById(
            "grupoCuartones"
        );

    contenedor.innerHTML="";

    ventaGrupo=[];

    if(!naveId){

        actualizarResumenGrupo();

        return;
    }

    const cuartones =
        todosLosCuartones.filter(
            c=>Number(c.nave_id)===naveId
        );

    cuartones.forEach(c=>{

        const div =
            document.createElement("div");

        div.className="grupo-item";

        div.innerHTML = `

            <label>
                C${c.numero}
                —
                ${Number(c.cantidad_cerdos || 0)} cerdos
            </label>

            <input
                type="number"
                min="0"
                max="${Number(c.cantidad_cerdos || 0)}"
                placeholder="Cantidad"
                data-cuarton-id="${c.id}"
                data-cuarton-numero="${c.numero}"
                data-nave-id="${c.nave_id}"
                data-nave-nombre="${c.nave_nombre}"
                oninput="actualizarResumenGrupo()"
            >

        `;

        contenedor.appendChild(div);

    });

    actualizarResumenGrupo();

}


/* ==================================================
   RESUMEN GRUPO
================================================== */

function actualizarResumenGrupo(){

    const inputs =
        document.querySelectorAll(
            "#grupoCuartones input"
        );

    let total=0;

    inputs.forEach(input=>{

        total += Number(input.value || 0);

    });

    const anterior =
        document.getElementById(
            "resumenGrupoCantidad"
        );

    if(anterior){

        anterior.innerText =
            "Total seleccionado: "+total;

    }

}


/* ==================================================
   SELECCIONAR CUARTÓN
================================================== */

function seleccionarCuarton(
    naveId,
    cuartonId,
    naveNombre,
    numero,
    cantidad
){

    naveSeleccionada={

        id:naveId,
        nombre:naveNombre

    };

    cuartonSeleccionado={

        id:cuartonId,
        numero:numero,
        cantidad:Number(cantidad || 0)

    };

    document.getElementById(
        "tituloCuarton"
    ).innerText =
        naveNombre+" - Cuartón "+numero;

    document.getElementById(
        "cantidadCuarton"
    ).innerText =
        Number(cantidad || 0);

    document.getElementById(
        "origenReagrupeTexto"
    ).innerText =

        naveNombre+
        " - Cuartón "+
        numero+
        " — "+
        Number(cantidad || 0)+
        " cerdos";

    ocultarTodosLosPaneles();

    document.getElementById(
        "panelCuarton"
    ).classList.remove("oculto");

}


/* ==================================================
   MOSTRAR AGREGAR
================================================== */

function mostrarAgregar(){

    ocultarTodosLosPaneles();

    document.getElementById(
        "panelEntrada"
    ).classList.remove("oculto");

}


/* ==================================================
   MOSTRAR CANTIDAD ENTRADA
================================================== */

function mostrarCantidadEntrada(tipo){

    tipoEntradaSeleccionado=tipo;

    document.getElementById(
        "tituloAgregar"
    ).innerText =
        "Entrada por "+tipo;

    ocultarTodosLosPaneles();

    document.getElementById(
        "panelAgregar"

/* ==================================================
   PROCESAR VENTA GRUPO
================================================== */

async function procesarVentaGrupo(){

    const inputs =
        document.querySelectorAll(
            "#grupoCuartones input"
        );

    const peso =
        Number(
            document.getElementById(
                "pesoVentaGrupo"
            ).value
        );

    if(!peso || peso<=0){

        alert("Introduce el peso total.");

        return;
    }

    const seleccionados=[];

    inputs.forEach(input=>{

        const cantidad =
            Number(input.value || 0);

        if(cantidad>0){

            seleccionados.push({

                id:Number(input.dataset.cuartonId),

                numero:input.dataset.cuartonNumero,

                naveId:Number(input.dataset.naveId),

                naveNombre:input.dataset.naveNombre,

                cantidad:cantidad

            });

        }

    });

    if(!seleccionados.length){

        alert(
            "Selecciona al menos un cuartón."
        );

        return;
    }

    /* ============================================
       LEER CANTIDADES ACTUALES
    ============================================ */

    const estados=[];

    for(const item of seleccionados){

        const {data,error} =
            await clienteSupabase
            .from("cuartones")
            .select("cantidad_cerdos")
            .eq("id",item.id)
            .single();

        if(error || !data){

            alert(
                "No se pudo consultar el cuartón C"+
                item.numero
            );

            return;
        }

        const actual =
            Number(data.cantidad_cerdos || 0);

        if(item.cantidad>actual){

            alert(
                "❌ El cuartón C"+
                item.numero+
                " no tiene suficientes cerdos."
            );

            return;
        }

        estados.push({

            ...item,

            anterior:actual,

            nuevo:actual-item.cantidad

        });

    }

    /* ============================================
       ACTUALIZAR
    ============================================ */

    const actualizados=[];

    for(const item of estados){

        const {error} =
            await clienteSupabase
            .from("cuartones")
            .update({
                cantidad_cerdos:item.nuevo
            })
            .eq("id",item.id);

        if(error){

            console.error(error);

            for(const anterior of actualizados){

                await clienteSupabase
                .from("cuartones")
                .update({
                    cantidad_cerdos:anterior.anterior
                })
                .eq("id",anterior.id);

            }

            alert(
                "❌ No se pudo completar la venta grupal."
            );

            return;
        }

        actualizados.push(item);

    }

    /* ============================================
       REGISTRO EN HISTORIAL
    ============================================ */

    const {data:sessionData} =
        await clienteSupabase.auth.getSession();

    const usuario =
        sessionData?.session?.user?.email || "";

    const totalCantidad =
        estados.reduce(
            (sum,item)=>
                sum+Number(item.cantidad),
            0
        );

    const listaCuartones =
        estados
        .map(item=>"C"+item.numero)
        .join(",");

    const listaNaves =
        [
            ...new Set(
                estados.map(
                    item=>item.naveNombre
                )
            )
        ]
        .join(",");

    const primerItem =
        estados[0];

    const {error:errorHistorial} =
        await clienteSupabase
        .from("movimientos_naves")
        .insert({

            fecha:new Date().toISOString(),

            nave_id:primerItem.naveId,

            cuarton_id:primerItem.id,

            nave:primerItem.naveNombre,

            cuarton:"C"+primerItem.numero,

            cuartones:listaCuartones,

            naves:listaNaves,

            operacion:"Salida",

            cantidad:totalCantidad,

            peso_kg:peso,

            usuario:usuario,

            motivo:"Venta"

        });

    if(errorHistorial){

        console.error(errorHistorial);

        for(const item of estados){

            await clienteSupabase
            .from("cuartones")
            .update({
                cantidad_cerdos:item.anterior
            })
            .eq("id",item.id);

        }

        alert(
            "❌ No se pudo registrar la venta en el historial."
        );

        return;
    }

    alert(
        "✅ Venta grupal registrada correctamente."
    );

    cerrarPanel();

    await cargarNaves();

}

/* ==================================================
   PROCESAR REAGRUPACIÓN
   IMPORTANTE:
   NO SE REGISTRA EN movimientos_naves
================================================== */

async function procesarReagrupe(){

    const cantidad =
        Number(
            document.getElementById(
                "cantidadReagrupe"
            ).value
        );

    const destinoId =
        Number(
            document.getElementById(
                "cuartonDestinoSalida"
            ).value
        );

    if(!cantidad || cantidad<=0){

        alert(
            "Introduce una cantidad válida."
        );

        return;
    }

    if(!destinoId){

        alert(
            "Selecciona un cuartón destino."
        );

        return;
    }

    if(
        Number(destinoId) ===
        Number(cuartonSeleccionado.id)
    ){

        alert(
            "❌ El destino no puede ser el mismo cuartón de origen."
        );

        return;
    }

    /* ============================================
       CONSULTAR ORIGEN
    ============================================ */

    const {
        data:origenActual,
        error:errorOrigen
    } =
        await clienteSupabase
        .from("cuartones")
        .select("*")
        .eq("id",cuartonSeleccionado.id)
        .single();

    if(errorOrigen || !origenActual){

        console.error(errorOrigen);

        alert(
            "❌ No se pudo consultar el cuartón de origen."
        );

        return;
    }

    /* ============================================
       CONSULTAR DESTINO
    ============================================ */

    const {
        data:destinoActual,
        error:errorDestino
    } =
        await clienteSupabase
        .from("cuartones")
        .select("*")
        .eq("id",destinoId)
        .single();

    if(errorDestino || !destinoActual){

        console.error(errorDestino);

        alert(
            "❌ No se pudo consultar el cuartón destino."
        );

        return;
    }

    const cantidadOrigen =
        Number(
            origenActual.cantidad_cerdos || 0
        );

    const cantidadDestino =
        Number(
            destinoActual.cantidad_cerdos || 0
        );

    if(cantidad>cantidadOrigen){

        alert(
            "❌ El cuartón de origen no tiene suficientes cerdos."
        );

        return;
    }

    const cantidadOrigenNueva =
        cantidadOrigen-cantidad;

    const cantidadDestinoNueva =
        cantidadDestino+cantidad;

    /* ============================================
       ACTUALIZAR ORIGEN
    ============================================ */

    const {
        error:errorUpdateOrigen
    } =
        await clienteSupabase
        .from("cuartones")
        .update({
            cantidad_cerdos:
                cantidadOrigenNueva
        })
        .eq("id",origenActual.id);

    if(errorUpdateOrigen){

        console.error(errorUpdateOrigen);

        alert(
            "❌ No se pudo actualizar el cuartón de origen."
        );

        return;
    }

    /* ============================================
       ACTUALIZAR DESTINO
    ============================================ */

    const {
        error:errorUpdateDestino
    } =
        await clienteSupabase
        .from("cuartones")
        .update({
            cantidad_cerdos:
                cantidadDestinoNueva
        })
        .eq("id",destinoActual.id);

    if(errorUpdateDestino){

        console.error(errorUpdateDestino);

        /* Restaurar origen */

        await clienteSupabase
        .from("cuartones")
        .update({
            cantidad_cerdos:
                cantidadOrigen
        })
        .eq("id",origenActual.id);

        alert(
            "❌ No se pudo actualizar el cuartón destino.\n\n"+
            "La cantidad del origen fue restaurada."
        );

        return;
    }

    /* ============================================
       IMPORTANTE:
       NO INSERTAR EN movimientos_naves
       
       La reagrupación es un movimiento interno
       y no debe aparecer en el historial.
    ============================================ */

    const origenInfo =
        todosLosCuartones.find(
            c=>Number(c.id)===Number(origenActual.id)
        );

    const destinoInfo =
        todosLosCuartones.find(
            c=>Number(c.id)===Number(destinoActual.id)
        );

    alert(

        "✅ Reagrupe realizado correctamente.\n\n"+

        "Cerdos trasladados: "+
        cantidad+

        "\n\nOrigen: "+

        (
            origenInfo
            ?
            origenInfo.nave_nombre+
            " - C"+
            origenInfo.numero
            :
            "C"+origenActual.numero
        )+

        "\nDestino: "+

        (
            destinoInfo
            ?
            destinoInfo.nave_nombre+
            " - C"+
            destinoInfo.numero
            :
            "C"+destinoActual.numero
        )

    );

    cerrarPanel();

    await cargarNaves();

}


/* ==================================================
   REGISTRAR MOVIMIENTO
   Se utiliza para entradas, ventas y muertes.
   NO se utiliza para reagrupación.
================================================== */

async function registrarMovimiento(
    operacion,
    cantidad,
    motivo,
    peso
){

    const {data:sessionData} =
        await clienteSupabase.auth.getSession();

    const usuario =
        sessionData?.session?.user?.email || "";

    const {error} =
        await clienteSupabase
        .from("movimientos_naves")
        .insert({

            fecha:new Date().toISOString(),

            nave_id:naveSeleccionada.id,

            cuarton_id:cuartonSeleccionado.id,

            nave:naveSeleccionada.nombre,

            cuarton:
                "C"+
                cuartonSeleccionado.numero,

            operacion:operacion,

            cantidad:Number(cantidad),

            peso_kg:Number(peso || 0),

            usuario:usuario,

            motivo:motivo

        });

    if(error){

        console.error(error);

        alert(
            "❌ No se pudo registrar el movimiento."
        );

        return false;
    }

    return true;

}
