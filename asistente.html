<script>

/* =====================================================
   VARIABLES
===================================================== */

let reconocimiento = null;

let escuchando = false;


/* =====================================================
   ELEMENTOS
===================================================== */

const estado =
document.getElementById("estado");

const pregunta =
document.getElementById("pregunta");

const botonMic =
document.getElementById("botonMic");

const textoEscuchado =
document.getElementById("textoEscuchado");

const textoVoz =
document.getElementById("textoVoz");

const respuestaTexto =
document.getElementById("respuestaTexto");


/* =====================================================
   NORMALIZAR
===================================================== */

function normalizar(texto){

    return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();

}


/* =====================================================
   HABLAR
===================================================== */

let vocesDisponibles = [];


/* CARGAR VOCES */

function cargarVoces(){

    if(!("speechSynthesis" in window))
        return;

    vocesDisponibles =
    window.speechSynthesis.getVoices();

}


/* ESCUCHAR CUANDO EL TELÉFONO CARGA LAS VOCES */

if("speechSynthesis" in window){

    cargarVoces();

    window.speechSynthesis.onvoiceschanged =
    cargarVoces;

}


/* HABLAR */

function hablar(texto){

    if(!("speechSynthesis" in window)){

        console.log(
            "Este navegador no admite síntesis de voz."
        );

        return;

    }


    /* DETENER CUALQUIER VOZ ANTERIOR */

    window.speechSynthesis.cancel();


    /* VOLVER A CARGAR LAS VOCES */

    cargarVoces();


    const mensaje =
    new SpeechSynthesisUtterance(texto);


    /* CONFIGURACIÓN */

    mensaje.lang = "es-ES";

    mensaje.rate = 0.9;

    mensaje.pitch = 1;

    mensaje.volume = 1;


    /* BUSCAR UNA VOZ EN ESPAÑOL */

    const vozEspanol =
    vocesDisponibles.find(voz =>

        voz.lang &&
        voz.lang.toLowerCase()
        .startsWith("es")

    );


    /* USAR VOZ ESPAÑOLA SI EXISTE */

    if(vozEspanol){

        mensaje.voice =
        vozEspanol;

        console.log(
            "Voz utilizada:",
            vozEspanol.name
        );

    }else{

        console.log(
            "No se encontró una voz en español."
        );

    }


    /* HABLAR */

    setTimeout(function(){

        window.speechSynthesis.speak(
            mensaje
        );

    },200);

}


/* =====================================================
   SESIÓN
===================================================== */

async function verificarSesion(){

    const {data,error} =
    await clienteSupabase.auth.getSession();

    if(error){

        console.error(error);
        return;

    }

    if(!data.session){

        window.location.href="login.html";

    }

}


/* =====================================================
   PREPARAR RECONOCIMIENTO
===================================================== */

function prepararReconocimiento(){

    const API =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


    if(!API){

        estado.innerText =
        "⚠️ El navegador no admite reconocimiento de voz.";

        botonMic.disabled=true;

        botonMic.style.opacity="0.5";

        return false;

    }


    reconocimiento = new API();


    reconocimiento.lang="es-ES";

    reconocimiento.continuous=false;

    reconocimiento.interimResults=true;

    reconocimiento.maxAlternatives=1;


    reconocimiento.onstart=function(){

        escuchando=true;

        botonMic.classList.add("escuchando");

        botonMic.innerText="🔴";

        estado.innerText=
        "🎙️ Escuchando... habla ahora";

        textoEscuchado.style.display="block";

        textoVoz.innerText="";

    };


    reconocimiento.onresult=function(event){

        let textoFinal="";

        let textoTemporal="";


        for(
            let i=event.resultIndex;
            i<event.results.length;
            i++
        ){

            const texto =
            event.results[i][0].transcript;


            if(event.results[i].isFinal){

                textoFinal += texto;

            }else{

                textoTemporal += texto;

            }

        }


        const mostrado =
        textoFinal || textoTemporal;


        textoVoz.innerText=mostrado;


        if(textoFinal){

            pregunta.value=
            textoFinal.trim();

            estado.innerText=
            "✅ Pregunta recibida";

            setTimeout(function(){

                procesarPregunta(
                    textoFinal.trim()
                );

            },300);

        }

    };


    reconocimiento.onerror=function(event){

        console.error(
            "Error de reconocimiento:",
            event.error
        );


        escuchando=false;

        botonMic.classList.remove("escuchando");

        botonMic.innerText="🎙️";


        if(event.error==="not-allowed"){

            estado.innerText=
            "❌ Permiso de micrófono denegado.";

            respuestaTexto.className="error";

            respuestaTexto.innerText=
            "Activa el permiso del micrófono para este sitio en Chrome.";

        }

        else if(event.error==="no-speech"){

            estado.innerText=
            "⚠️ No detecté voz. Acércate al teléfono y vuelve a intentarlo.";

        }

        else if(event.error==="audio-capture"){

            estado.innerText=
            "❌ No se encontró el micrófono.";

        }

        else if(event.error==="network"){

            estado.innerText=
            "❌ Error de conexión del reconocimiento de voz.";

        }

        else{

            estado.innerText=
            "⚠️ Error de voz: "+event.error;

        }

    };


    reconocimiento.onend=function(){

        escuchando=false;

        botonMic.classList.remove("escuchando");

        botonMic.innerText="🎙️";

    };


    return true;

}


/* =====================================================
   INICIAR ESCUCHA
===================================================== */

function iniciarEscucha(){

    if(!reconocimiento){

        const preparado =
        prepararReconocimiento();

        if(!preparado)
            return;

    }


    if(escuchando){

        reconocimiento.stop();

        return;

    }


    textoVoz.innerText="";

    textoEscuchado.style.display="block";


    try{

        reconocimiento.start();

    }catch(error){

        console.error(error);

        reconocimiento=null;

        prepararReconocimiento();

        try{

            reconocimiento.start();

        }catch(e){

            estado.innerText=
            "❌ No se pudo iniciar el micrófono.";

        }

    }

}


/* =====================================================
   EJEMPLOS
===================================================== */

function usarEjemplo(texto){

    pregunta.value=texto;

    procesarPregunta(texto);

}


/* =====================================================
   TEXTO
===================================================== */

function procesarDesdeTexto(){

    const texto =
    pregunta.value.trim();

    if(!texto)
        return;

    procesarPregunta(texto);

}


pregunta.addEventListener(
"keydown",
function(event){

    if(event.key==="Enter"){

        procesarDesdeTexto();

    }

});


/* =====================================================
   PRODUCTOS
===================================================== */

    await clienteSupabase
    .from("productos")
    .select("Identificación,Nombre,Unidad,Cantidad")

        throw error;


    return data || [];

/* =====================================================
   MATERIALES CONSTRUCCIÓN
===================================================== */

async function obtenerMaterialesConstruccion(){

    const {data,error} =
    await clienteSupabase
    .from("materiales_construccion")
    .select("id,Nombre,Unidad,Cantidad")
    .order("Nombre");


    if(error)
        throw error;


    return data || [];

}


/* =====================================================
   BUSCAR PRODUCTO
===================================================== */

function buscarProducto(texto,productos){

    const q=normalizar(texto);


    let producto =
    productos.find(p => {

        const nombre =
        normalizar(p.Nombre || "");

        return nombre &&
        q.includes(nombre);

    });


    if(producto)
        return producto;


    const equivalencias={

        "maiz":"maiz",
        "maz":"maiz",
        "soya":"soya",
        "soja":"soya",
        "cebada":"cebada",
        "salvado":"salvado",
        "sal":"sal",
        "calcio":"calcio",
        "premezcla":"premezcla",
        "miel":"miel",
        "palmiche":"palmiche",
        "chicharo":"chicharo",
        "pienso":"pienso"

    };


    for(const palabra in equivalencias){

        if(q.includes(palabra)){

            const objetivo =
            equivalencias[palabra];


            producto =
            productos.find(p =>
                normalizar(p.Nombre || "")
                .includes(objetivo)
            );


            if(producto)
                return producto;

        }

    }


    return null;

}


/* =====================================================
   BUSCAR MATERIAL
===================================================== */

function buscarMaterial(texto,materiales){

    const q=normalizar(texto);


    return materiales.find(m => {

        const nombre =
        normalizar(m.Nombre || "");

        return nombre &&
        q.includes(nombre);

    }) || null;

}

/* =====================================================
   MOVIMIENTOS HOY
===================================================== */

async function obtenerMovimientosHoy(){

    const fechas=inicioFinHoy();


    const {data,error} =
    await clienteSupabase
    .from("movimientos")
    .select("*")
    .gte("Fecha",fechas.inicio)
    .lt("Fecha",fechas.fin)
    .order("Fecha",{ascending:false});


    if(error)
        throw error;

/* =====================================================
   ENTRADAS HOY
===================================================== */

async function consultarEntradasHoy(){

    const movimientos =
    await obtenerMovimientosHoy();


    const entradas =
    movimientos.filter(m =>
        normalizar(m.Tipo || "")
        .includes("entrada")
    );


    if(!entradas.length){

        return "No hay entradas de mercancía registradas hoy.";

    }


    let total=0;


    entradas.forEach(m=>{

        total +=
        Number(m.Cantidad)||0;

    });


    return `Hoy se registraron ${entradas.length} entradas de mercancía, por un total de ${formatearNumero(total)} unidades de cantidad registrada.`;

}

/* =====================================================
   ÚLTIMAS SALIDAS
===================================================== */

async function consultarUltimasSalidas(){

    const {data,error} =
    await clienteSupabase
    .from("movimientos")
    .select("*")
    .order("Fecha",{ascending:false})
    .limit(50);


    if(error)
        throw error;


    const salidas =
    (data||[]).filter(m =>
        normalizar(m.Tipo||"")
        .includes("salida")
    );


    if(!salidas.length)
        return "No hay salidas registradas.";


    let texto =
    "Las últimas salidas registradas son:\n\n";


    salidas.slice(0,5).forEach((m,i)=>{

        texto +=
        `${i+1}. ${m.Producto||"Producto"} — ${formatearNumero(Number(m.Cantidad)||0)}\n`;

    });


    return texto;

}

   ÚLTIMOS MOVIMIENTOS
===================================================== */

    .from("movimientos")

    .order("Fecha",{ascending:false})

    data.forEach((m,i)=>{

        texto +=
        `${i+1}. ${m.Tipo||"Movimiento"} — ${m.Producto||""} — ${formatearNumero(Number(m.Cantidad)||0)}\n`;

}

/* =====================================================
   RECETAS
===================================================== */

async function consultarRecetas(){

    const {data,error} =
    await clienteSupabase
    .from("recetas")
    .select("nombre,producto_resultado,cantidad_resultado")
    .order("nombre");


    if(error)
        throw error;


    if(!data||!data.length)
        return "No hay recetas registradas.";


    let texto=
    "Las recetas registradas son:\n\n";


    data.forEach((r,i)=>{

        texto +=
        `${i+1}. ${r.nombre}`;


        if(r.producto_resultado){

            texto +=
            ` → ${r.producto_resultado}`;

        }


        if(r.cantidad_resultado){

            texto +=
            ` (${r.cantidad_resultado})`;

        }


        texto+="\n";

    });


    return texto;

}


/* =====================================================
   FORMATO
===================================================== */

function formatearNumero(numero){

    return new Intl.NumberFormat(
        "es-ES",
        {
            maximumFractionDigits:2
        }
    ).format(numero);

}


/* =====================================================
   PROCESAR PREGUNTA
===================================================== */

async function procesarPregunta(texto){

    if(!texto)
        return;


    respuestaTexto.className="cargando";

    respuestaTexto.innerText=
    "🔎 Buscando en ElDesierto...";


    estado.innerText=
    "Consultando los datos...";


    try{

        const q=normalizar(texto);


        const productos =
        await obtenerProductos();


        const materiales =
        await obtenerMaterialesConstruccion();


        const producto =
        buscarProducto(q,productos);


        const material =
        buscarMaterial(q,materiales);


        /* MATERIALES */

        if(material && (

            q.includes("material") ||
            q.includes("construccion") ||
            q.includes("cemento") ||
            q.includes("bloque") ||
            q.includes("tubo") ||
            q.includes("tabla") ||
            q.includes("cinc") ||
            q.includes("fibra") ||
            q.includes("arena") ||
            q.includes("gravilla") ||
            q.includes("piedra")

        )){

            mostrarRespuesta(
                `Hay ${formatearNumero(Number(material.Cantidad)||0)} ${material.Unidad||""} de ${material.Nombre} disponibles en materiales de construcción.`
            );

            return;

        }


        /* LISTA MATERIALES */

        if(

            q.includes("materiales de construccion") ||
            q.includes("materiales construccion")

        ){

            mostrarRespuesta(
                await consultarListaMateriales()
            );

            return;

        }


        /* CERDOS */

        if(

            q.includes("cerdos") ||
            q.includes("puercos") ||
            q.includes("cochinos")

        ){

            mostrarRespuesta(
                await consultarCerdos()
            );

            return;

        }


        /* ENTRADAS */

        if(

            q.includes("entrada hoy") ||
            q.includes("entradas hoy") ||
            q.includes("entro hoy") ||
            q.includes("entraron hoy") ||
            q.includes("cuanto entro")

        ){

            mostrarRespuesta(
                await consultarEntradasHoy()
            );

            return;

        }


        /* SALIDAS */

        if(

            q.includes("salida hoy") ||
            q.includes("salidas hoy") ||
            q.includes("salio hoy") ||
            q.includes("salieron hoy") ||
            q.includes("cuanto salio")

        ){

            mostrarRespuesta(
                await consultarSalidasHoy()
            );

            return;

        }


        /* ÚLTIMAS SALIDAS */

        if(

            q.includes("ultimas salidas") ||
            q.includes("ultimas salida")

        ){

            mostrarRespuesta(
                await consultarUltimasSalidas()
            );

            return;

        }


        /* ÚLTIMOS MOVIMIENTOS */

        if(

            q.includes("ultimos movimientos") ||
            q.includes("ultimo movimiento")

        ){

            mostrarRespuesta(
                await consultarUltimosMovimientos()
            );

            return;

        }


        /* LISTA PRODUCTOS */

        if(

            q.includes("que productos hay") ||
            q.includes("productos hay") ||
            q.includes("lista de productos")

        ){

            mostrarRespuesta(
                await consultarListaProductos()
            );

            return;

        }


        /* RECETAS */

        if(

            q.includes("que recetas hay") ||
            q.includes("recetas hay") ||
            q.includes("lista de recetas")

        ){

            mostrarRespuesta(
                await consultarRecetas()
            );

            return;

        }


        /* PRODUCTO */

        if(producto){

            mostrarRespuesta(
                `Hay ${formatearNumero(Number(producto.Cantidad)||0)} ${producto.Unidad||""} de ${producto.Nombre} disponibles en el inventario.`
            );

            return;

        }


        /* NO ENTENDIDO */

        const respuesta =
        "No encontré esa información registrada en ElDesierto.";

        mostrarRespuesta(respuesta);

    }

    catch(error){

        console.error(error);

        respuestaTexto.className="error";

        respuestaTexto.innerText=
        "❌ No pude consultar los datos de ElDesierto.";

        estado.innerText=
        "Error de conexión con Supabase";

    }

}


/* =====================================================
   MOSTRAR
===================================================== */

function mostrarRespuesta(texto){

    respuestaTexto.className="exito";

    respuestaTexto.innerText=texto;

    estado.innerText=
    "✅ Consulta completada";

    hablar(texto);

}


/* =====================================================
   INICIO
===================================================== */

async function iniciar(){

    await verificarSesion();

    prepararReconocimiento();

}


iniciar();

</script>
