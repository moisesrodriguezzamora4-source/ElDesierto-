<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;

.subtitulo{

}

.contenedor{

}

.panel{

    border-radius:20px;

.estado{

    border-color:#168f42;
}

.estado.error{

}

.zona-microfono{
    display:flex;
    justify-content:center;
    margin:15px 0 22px;
}

#microfono{
    width:105px;
    height:105px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    color:white;
    font-size:42px;
    background:radial-gradient(circle at 35% 25%,#ff4a4a,#d00000 45%,#680000 100%);
    box-shadow:
        0 0 0 5px rgba(120,0,0,.35),
        0 0 30px rgba(255,0,0,.35),
        inset 0 -8px 15px rgba(0,0,0,.35);
    transition:.2s;
    -webkit-tap-highlight-color:transparent;
}

#microfono:active{transform:scale(.94)}
#microfono:hover{transform:scale(1.04)}

#microfono.escuchando{
    animation:pulso 1.1s infinite;
}

@keyframes pulso{
    0%{box-shadow:0 0 0 5px rgba(120,0,0,.35),0 0 25px rgba(255,0,0,.35)}
    50%{box-shadow:0 0 0 15px rgba(255,0,0,.08),0 0 50px rgba(255,0,0,.8)}
    100%{box-shadow:0 0 0 5px rgba(120,0,0,.35),0 0 25px rgba(255,0,0,.35)}
}

    height:390px;
    overflow-y:auto;
    padding:15px;
    margin-bottom:15px;
    border-radius:15px;
    background:#050505;
    border:1px solid #292929;
}

.mensaje{
    max-width:88%;

    border-radius:14px;

}

.mensaje.usuario{
    margin-left:auto;
    background:linear-gradient(135deg,#a90000,#590000);
    border-bottom-right-radius:4px;

.mensaje.asistente{
    margin-right:auto;

}

#btnEnviar{

    padding:0 22px;

<script>
(function(){

"use strict";

/* ==========================================================
   ESTADO GENERAL
========================================================== */

var reconocimiento = null;
var escuchando = false;
var procesando = false;
var hablando = false;

var voces = [];
var colaVoz = [];
var indiceVoz = 0;

var nombreUsuario =
    localStorage.getItem("elDesierto_nombre_usuario") || "";

var historialConversacion = [];

var estado = document.getElementById("estado");
var chat = document.getElementById("chat");
var pregunta = document.getElementById("pregunta");
var btnEnviar = document.getElementById("btnEnviar");
var microfono = document.getElementById("microfono");


/* ==========================================================
   ESTADO
========================================================== */

function cambiarEstado(texto,tipo){

    if(!estado) return;

    estado.textContent = texto;
    estado.className = "estado";

    if(tipo){
        estado.classList.add(tipo);
    }
}


/* ==========================================================
   NORMALIZACIÓN
========================================================== */

function normalizar(texto){

    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();
}


/* ==========================================================
   CHAT
========================================================== */

function agregarMensaje(texto,tipo){

    if(!chat) return;

    var div = document.createElement("div");

    div.className = "mensaje " + tipo;

    div.textContent = texto;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


function iniciarChat(){

    if(!chat) return;

    chat.innerHTML = "";

    agregarMensaje(
        "Hola. Soy el asistente inteligente de ElDesierto. Puedes hablar conmigo o escribir tu pregunta.",
        "asistente"
    );

    if(nombreUsuario){

        agregarMensaje(
            "Hola nuevamente, " + nombreUsuario + ". Estoy listo para ayudarte.",
            "asistente"
        );
    }
}


/* ==========================================================
   SUPABASE
========================================================== */

function cliente(){

    try{

        if(
            typeof window.clienteSupabase !== "undefined" &&
            window.clienteSupabase
        ){
            return window.clienteSupabase;
        }

    }catch(e){}

    return null;
}


/* ==========================================================
   VOZ
========================================================== */

function cargarVoces(){

    if(!("speechSynthesis" in window)){
        return;
    }

    try{
        voces = window.speechSynthesis.getVoices() || [];
    }catch(e){}
}


function vozEspañola(){

    cargarVoces();

    for(var i=0;i<voces.length;i++){

        if(/^es[-_]/i.test(voces[i].lang)){
            return voces[i];
        }
    }

    return null;
}


function quitarEmojis(texto){

    var s = String(texto || "");

    /*
     * No usamos propiedades Unicode avanzadas para evitar
     * errores de sintaxis en WebView antiguos.
     */

    s = s.replace(/[\u{1F300}-\u{1FAFF}]/gu,"");
    s = s.replace(/[\u{2600}-\u{27BF}]/gu,"");

    return s
        .replace(/[*_#`~]/g,"")
        .replace(/\s+/g," ")
        .trim();
}


function detenerVoz(){

    hablando = false;
    colaVoz = [];
    indiceVoz = 0;

    try{

        if("speechSynthesis" in window){
            window.speechSynthesis.cancel();
        }

    }catch(e){}
}


function hablar(texto){

    if(!("speechSynthesis" in window)){
        return;
    }

    detenerVoz();

    var limpio = quitarEmojis(texto);

    if(!limpio){
        return;
    }

    colaVoz = limpio.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [limpio];

    indiceVoz = 0;
    hablando = true;

    hablarParte();
}


function hablarParte(){

    if(!hablando){
        return;
    }

    if(indiceVoz >= colaVoz.length){

        hablando = false;
        return;
    }

    var texto = colaVoz[indiceVoz++];

    try{

        var u = new SpeechSynthesisUtterance(texto);

        u.lang = "es-ES";
        u.rate = .95;
        u.pitch = 1;
        u.volume = 1;

        var voz = vozEspañola();

        if(voz){
            u.voice = voz;
        }

        u.onend = hablarParte;
        u.onerror = hablarParte;

        window.speechSynthesis.speak(u);

    }catch(e){

        hablando = false;
    }
}


function probarVoz(){

    cambiarEstado("Probando voz...","activo");

    hablar(
        "Hola. La voz del asistente de ElDesierto está funcionando correctamente."
    );
}


/* ==========================================================
   RECONOCIMIENTO DE VOZ
========================================================== */

function prepararReconocimiento(){

    var SR =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SR){
        return false;
    }

    if(reconocimiento){
        return true;
    }

    try{

        reconocimiento = new SR();

        reconocimiento.lang = "es-ES";
        reconocimiento.continuous = false;
        reconocimiento.interimResults = false;
        reconocimiento.maxAlternatives = 1;

        reconocimiento.onstart = function(){

            escuchando = true;

            microfono.classList.add("escuchando");
            microfono.textContent = "🔴";

            cambiarEstado(
                "Te estoy escuchando...",
                "activo"
            );
        };


        reconocimiento.onresult = function(event){

            var texto = "";

            if(
                event.results &&
                event.results.length
            ){

                texto =
                    event.results[
                        event.results.length - 1
                    ][0].transcript;
            }

            texto = texto.trim();

            if(texto){

                pregunta.value = texto;

                enviarPregunta();
            }
        };


        reconocimiento.onerror = function(event){

            console.log(
                "Micrófono:",
                event.error
            );

            escuchando = false;

            microfono.classList.remove("escuchando");
            microfono.textContent = "🎙️";

            if(event.error === "not-allowed"){

                cambiarEstado(
                    "Debes permitir el acceso al micrófono.",
                    "error"
                );

                return;
            }

            if(event.error === "no-speech"){

                cambiarEstado(
                    "No detecté voz. Inténtalo nuevamente.",
                    "error"
                );

                return;
            }

            cambiarEstado(
                "No pude iniciar el micrófono.",
                "error"
            );
        };


        reconocimiento.onend = function(){

            escuchando = false;

            microfono.classList.remove("escuchando");
            microfono.textContent = "🎙️";

            if(
                estado &&
                estado.classList.contains("activo")
            ){
                cambiarEstado("Asistente listo");
            }
        };

        return true;

    }catch(e){

        console.error(e);

        reconocimiento = null;

        return false;
    }
}


function iniciarEscucha(){

    var disponible = prepararReconocimiento();

    if(!disponible){

        cambiarEstado(
            "Tu navegador no permite reconocimiento de voz.",
            "error"
        );

        agregarMensaje(
            "El micrófono no está disponible en este navegador. Puedes escribirme usando el campo de texto.",
            "asistente"
        );

        return;
    }

    if(escuchando){

        try{
            reconocimiento.stop();
        }catch(e){}

        return;
    }

    try{

        reconocimiento.start();

    }catch(e){

        setTimeout(function(){

            try{

                if(!escuchando){
                    reconocimiento.start();
                }

            }catch(error){

                cambiarEstado(
                    "No pude activar el micrófono. Inténtalo nuevamente.",
                    "error"
                );
            }

        },400);
    }
}


/* ==========================================================
   CONSULTA INVENTARIO
========================================================== */

async function inventario(){

    var db = cliente();

    if(!db){

        return "No hay conexión disponible con la base de datos.";
    }

    try{

        var r =
            await db
            .from("productos")
            .select("*")
            .order("id",{ascending:true});

        if(r.error){
            console.error(r.error);
            return "No pude consultar el inventario.";
        }

        if(!r.data || !r.data.length){
            return "No hay información registrada en el inventario.";
        }

        var texto = "Inventario actual:\n\n";

        r.data.forEach(function(p){

            var nombre =
                p.Nombre ??
                p.nombre ??
                p.producto ??
                "Producto";

            var unidad =
                p.Unidad ??
                p.unidad ??
                "";

            var cantidad =
                p.Cantidad ??
                p.cantidad ??
                0;

            texto +=
                nombre +
                ": " +
                Number(cantidad).toLocaleString("es-ES") +
                " " +
                unidad +
                "\n";
        });

        return texto.trim();

    }catch(e){

        console.error(e);

        return "Ocurrió un error consultando el inventario.";
    }
}

/* ==========================================================
   RECETAS
========================================================== */

async function recetas(){

    var db = cliente();

    if(!db){
        return "No hay conexión disponible con la base de datos.";
    }

    try{

        var r =
            await db
            .from("recetas")
            .select("*")

        if(r.error){
            console.error(r.error);
            return "No pude consultar las recetas.";
        }

        if(!r.data || !r.data.length){
            return "No hay información registrada de recetas.";
        }

        var texto = "Recetas registradas:\n\n";

        r.data.forEach(function(x){

            var nombre =
                x.nombre ??
                x.Nombre ??
                "Receta";

            var producto =
                x.producto_resultado ??
                x.Producto_resultado ??
                "";

            var cantidad =
                x.cantidad_resultado ??
                x.Cantidad_resultado ??
                "";

            texto += nombre;

            if(producto){
                texto += " → " + producto;
            }

            if(cantidad !== ""){
                texto +=
                    " (" +
                    Number(cantidad).toLocaleString("es-ES") +
                    ")";
            }

            texto += "\n";
        });

        return texto.trim();

    }catch(e){

        console.error(e);

    }

/* ==========================================================
   CERDOS
========================================================== */

async function consultarCerdos(){

    var db = cliente();

    if(!db){
        return "No hay conexión disponible con la base de datos.";
    }

    /*
     * Se consultan las tablas conocidas sin inventar columnas.
     */

    try{

        var tablas = [
            "naves",
            "cuartones"
        ];

        var resultados = [];

        for(var i=0;i<tablas.length;i++){

            try{

                var r =
                    await db
                    .from(tablas[i])
                    .select("*");

                if(!r.error && r.data){
                    resultados.push({
                        tabla:tablas[i],
                        datos:r.data
                    });
                }

            }catch(e){}
        }

        if(!resultados.length){

            return "No hay información registrada de naves o cuartones.";
        }

        var texto = "Información registrada de naves y cuartones:\n\n";

        resultados.forEach(function(grupo){

            texto +=
                grupo.tabla.toUpperCase() +
                ": " +
                grupo.datos.length +
                " registros\n";
        });

        return texto.trim();

    }catch(e){

        console.error(e);

        return "No pude consultar la información de los cerdos.";
    }
}


/* ==========================================================
   IDENTIFICACIÓN DE PREGUNTAS
========================================================== */

function esSaludo(t){

    return [
        "hola",
        "buenos dias",
        "buenas",
        "buenas tardes",
        "buenas noches",
        "saludos",
        "como estas",
        "como esta"
    ].some(function(x){
        return t.includes(x);
    });
}


function esNo(t){

    return [
        "no",
        "nada",
        "ninguna",
        "eso es todo",
        "ya esta",
        "no gracias",
        "nada mas"
    ].includes(t);
}


/* ==========================================================
   PROCESAMIENTO PRINCIPAL
========================================================== */

async function procesarPregunta(original){

    var t = normalizar(original);

    if(!t){
        return "Puedes repetir la pregunta.";
    }


    /* NOMBRE */

    var m = original.match(
        /(?:me llamo|mi nombre es|soy)\s+(.+)/i
    );

    if(m){

        var nombre =
            m[1]
            .trim()
            .replace(/[.!?,]+$/,"");

        if(nombre){

            nombreUsuario = nombre;

            localStorage.setItem(
                "elDesierto_nombre_usuario",
                nombreUsuario
            );

            return "Mucho gusto, " +
                   nombreUsuario +
                   ". Ya sé cómo llamarte. ¿En qué puedo ayudarte?";
        }
    }


    /* SALUDO */

    if(esSaludo(t)){

        if(!nombreUsuario){

            return "Hola. Me alegra hablar contigo. ¿Cómo te llamas?";
        }

        return "Hola, " +
               nombreUsuario +
               ". Estoy listo para ayudarte con ElDesierto. ¿Qué necesitas?";
    }


    /* DESPEDIDA */

    if(esNo(t)){

        return nombreUsuario
            ? "De acuerdo, " + nombreUsuario + ". Puedes consultarme cuando necesites algo en ElDesierto. Hasta luego."
            : "De acuerdo. Puedes consultarme cuando necesites algo en ElDesierto. Hasta luego.";
    }


    /* IDENTIDAD */

    if(
        t.includes("quien eres") ||
        t.includes("que eres") ||
        t.includes("como te llamas")
    ){

        return "Soy el asistente inteligente de ElDesierto. Estoy conectado al sistema para consultar información y ayudarte con las operaciones que estén configuradas.";
    }


    /* GRACIAS */

    if(
        t.includes("gracias") ||
        t.includes("muchas gracias")
    ){

        return nombreUsuario
            ? "De nada, " + nombreUsuario + ". ¿Necesitas algo más?"
            : "De nada. ¿Necesitas algo más?";
    }


    /* INVENTARIO */

    if(
        t.includes("inventario") ||
        t.includes("existencias") ||
        t.includes("productos tenemos") ||
        t.includes("que tenemos")
    ){

        return await inventario();
    }


    /* MATERIALES */

    if(
        t.includes("materiales de construccion") ||
        t.includes("material de construccion") ||
        t.includes("cemento") ||
        t.includes("arena") ||
        t.includes("bloques")
    ){

        return await materiales();
    }


    /* PRODUCTOS ELABORADOS */

    if(
        t.includes("productos elaborados") ||
        t.includes("productos fabricados") ||
        t.includes("productos terminados")
    ){

        return await productosElaborados();
    }


    /* RECETAS */

    if(
        t.includes("recetas") ||
        t === "receta" ||
        t.includes("que recetas")
    ){

        return await recetas();
    }


    /* MOVIMIENTOS */

    if(
        t.includes("ultimas salidas") ||
        t.includes("ultimos movimientos") ||
        t.includes("movimientos recientes") ||
        t.includes("historial de movimientos")
    ){

        return await movimientos();
    }


    /* CERDOS */

    if(
        t.includes("cuantos cerdos") ||
        t.includes("cerdos tenemos") ||
        t.includes("cantidad de cerdos") ||
        t.includes("naves") ||
        t.includes("cuartones")
    ){

        return await consultarCerdos();
    }


    /* FABRICACIÓN */

    if(
        t.includes("fabricacion") ||
        t.includes("fabricar") ||
        t.includes("elaborar pienso") ||
        t.includes("producir pienso")
    ){

        return "Puedo ayudarte con una fabricación. Dime el nombre de la receta y la cantidad que quieres fabricar.";
    }


    /* ENTRADA */

    if(
        t.includes("entrada de mercancia") ||
        t.includes("entrada de mercancía") ||
        t.includes("registrar entrada")
    ){

        return "Puedo ayudarte a registrar una entrada. Dime el producto y la cantidad.";
    }


    /* SALIDA */

    if(
        t.includes("salida de mercancia") ||
        t.includes("registrar salida")
    ){

        return "Puedo ayudarte a registrar una salida. Dime el producto y la cantidad.";
    }


    /* VENTAS */

    if(
        t.includes("venta de cerdos") ||
        t.includes("vender cerdos") ||
        t.includes("venta")
    ){

        return "Puedo ayudarte con una venta de cerdos. Para ejecutarla correctamente necesito utilizar los datos exactos de la nave y cuartón correspondientes.";
    }


    /* MUERTES */

    if(
        t.includes("muerte") ||
        t.includes("cerdo muerto") ||
        t.includes("cerdos muertos")
    ){

        return "Puedo registrar una muerte de cerdos cuando me indiques la nave, el cuartón y la cantidad.";
    }


    /* REAGRUPES */

    if(
        t.includes("reagrup") ||
        t.includes("mover cerdos") ||
        t.includes("cambiar cerdos de cuarton")
    ){

        return "Puedo ayudarte con un reagrupamiento. Indícame de qué nave y cuartón salen los cerdos y a qué nave y cuartón van.";
    }


    /* DESTETE */

    if(
        t.includes("destete") ||
        t.includes("destetar")
    ){

        return "Puedo consultar la información de destete registrada en ElDesierto.";
    }


    /* FECHAS */

    if(
        t.includes("hoy") ||
        t.includes("ayer") ||
        t.includes("esta semana") ||
        t.includes("semana pasada") ||
        t.includes("este mes") ||
        t.includes("mes pasado")
    ){

        return "Puedo consultar la información por período. Dime qué operación quieres consultar y el período: hoy, ayer, esta semana, la semana pasada, este mes o el mes pasado.";
    }


    /* NEGOCIO */

    if(
        t.includes("como va el negocio") ||
        t.includes("como esta el negocio")
    ){

        return "Puedo revisar los datos registrados de ElDesierto: inventarios, productos elaborados, materiales, recetas, movimientos y la información de los cerdos. Dime qué parte quieres revisar.";
    }


    /* NO ENTENDIDO */

    return "No entendí completamente la pregunta. Puedes repetir la pregunta.";
}


/* ==========================================================
   ENVIAR
========================================================== */

async function enviarPregunta(){

    if(procesando){
        return;
    }

    var texto =
        pregunta.value.trim();

    if(!texto){

        cambiarEstado(
            "Escribe una pregunta.",
            "error"
        );

        pregunta.focus();

        return;
    }

    procesando = true;

    btnEnviar.disabled = true;
    btnEnviar.textContent = "Procesando...";

    agregarMensaje(texto,"usuario");

    pregunta.value = "";

    cambiarEstado(
        "Consultando ElDesierto...",
        "activo"
    );

    try{

        var respuesta =
            await procesarPregunta(texto);

        agregarMensaje(
            respuesta,
            "asistente"
        );

        hablar(respuesta);

        historialConversacion.push({
            pregunta:texto,
            respuesta:respuesta,
            fecha:new Date().toISOString()
        });

        try{

            localStorage.setItem(
                "elDesierto_conversacion",
                JSON.stringify(
                    historialConversacion.slice(-50)
                )
            );

        }catch(e){}

        cambiarEstado(
            "Asistente listo",
            "exito"
        );

    }catch(e){

        console.error(
            "Error del asistente:",
            e
        );

        var mensaje =
            "Ocurrió un problema al procesar la pregunta. Puedes repetirla.";

        agregarMensaje(
            mensaje,
            "asistente"
        );

        cambiarEstado(
            "Error al procesar",
            "error"
        );

        hablar(mensaje);

    }finally{

        procesando = false;

        btnEnviar.disabled = false;
        btnEnviar.textContent = "Enviar";

        pregunta.focus();
    }
}


/* ==========================================================
   EVENTOS
========================================================== */

btnEnviar.addEventListener(

        e.preventDefault();
        enviarPregunta();

);

========================================================== */

    window.speechSynthesis.onvoiceschanged =

iniciarChat();

prepararReconocimiento();

);

})();
