<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asistente - ElDesierto</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#520000 0%,#210000 28%,#080000 65%,#000 100%);
}

/* ==================================================
   CABECERA
================================================== */

header{
    width:100%;
    padding:18px 20px;
    background:linear-gradient(135deg,#090909,#190000);
    border-bottom:2px solid #b00000;
    box-shadow:0 5px 25px rgba(255,0,0,.2);
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:1px;
    color:#fff;
    text-shadow:0 0 12px rgba(255,0,0,.4);
}

.logo span{
    color:#e00000;
}

.subtitulo{
    margin-top:5px;
    color:#aaa;
    font-size:14px;
}

/* ==================================================
   CONTENEDOR
================================================== */

.contenedor{
    width:min(950px,94%);
    margin:22px auto;
}

.panel{
    background:
        linear-gradient(145deg,rgba(30,30,30,.97),rgba(5,5,5,.98));
    border:1px solid #480000;
    border-radius:20px;
    padding:20px;
    box-shadow:
        0 15px 45px rgba(0,0,0,.7),
        inset 0 0 25px rgba(255,0,0,.04);
}

/* ==================================================
   ESTADO
================================================== */

.estado{
    width:100%;
    padding:13px 16px;
    border-radius:12px;
    background:#111;
    border:1px solid #333;
    color:#bbb;
    text-align:center;
    margin-bottom:18px;
    font-size:14px;
}

.estado.activo{
    border-color:#d00000;
    color:#ff4a4a;
    box-shadow:0 0 15px rgba(255,0,0,.15);
}

.estado.exito{
    border-color:#168f42;
    color:#55e889;
}

.estado.error{
    border-color:#a00000;
    color:#ff6b6b;
}

/* ==================================================
   MICROFONO
================================================== */

.zona-microfono{
    display:flex;
    justify-content:center;
    margin:15px 0 22px;
}

#microfono{
    width:105px;
    height:105px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    color:white;
    font-size:42px;
    background:
        radial-gradient(circle at 35% 25%,#ff4a4a,#d00000 45%,#680000 100%);
    box-shadow:
        0 0 0 5px rgba(120,0,0,.35),
        0 0 30px rgba(255,0,0,.35),
        inset 0 -8px 15px rgba(0,0,0,.35);
    transition:.2s;
    -webkit-tap-highlight-color:transparent;
}

#microfono:active{
    transform:scale(.94);
}

#microfono:hover{
    transform:scale(1.04);
}

#microfono.escuchando{
    animation:pulso 1.2s infinite;
}

@keyframes pulso{
    0%{
        box-shadow:
            0 0 0 5px rgba(120,0,0,.35),
            0 0 25px rgba(255,0,0,.35);
    }

    50%{
        box-shadow:
            0 0 0 14px rgba(255,0,0,.08),
            0 0 50px rgba(255,0,0,.75);
    }

    100%{
        box-shadow:
            0 0 0 5px rgba(120,0,0,.35),
            0 0 25px rgba(255,0,0,.35);
    }
}

/* ==================================================
   CHAT
================================================== */

.chat{
    height:390px;
    overflow-y:auto;
    padding:15px;
    border-radius:15px;
    background:#050505;
    border:1px solid #292929;
    margin-bottom:15px;
}

.mensaje{
    max-width:88%;
    padding:12px 15px;
    margin-bottom:12px;
    border-radius:14px;
    line-height:1.45;
    word-wrap:break-word;
}

.mensaje.usuario{
    margin-left:auto;
    background:linear-gradient(135deg,#a90000,#590000);
    border-bottom-right-radius:4px;
}

.mensaje.asistente{
    margin-right:auto;
    background:linear-gradient(135deg,#202020,#101010);
    border:1px solid #383838;
    border-bottom-left-radius:4px;
}

.mensaje strong{
    color:#ff3d3d;
}

/* ==================================================
   ENTRADA
================================================== */

.entrada{
    display:flex;
    gap:10px;
}

#pregunta{
    flex:1;
    min-width:0;
    padding:15px;
    border-radius:12px;
    border:1px solid #444;
    outline:none;
    background:#0c0c0c;
    color:white;
    font-size:16px;
}

#pregunta:focus{
    border-color:#c00000;
    box-shadow:0 0 10px rgba(255,0,0,.12);
}

#pregunta::placeholder{
    color:#777;
}

#btnEnviar{
    border:none;
    border-radius:12px;
    padding:0 22px;
    background:linear-gradient(135deg,#d00000,#720000);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

#btnEnviar:active{
    transform:scale(.96);
}

/* ==================================================
   CONTROLES
================================================== */

.controles{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.control{
    border:1px solid #3d3d3d;
    background:#111;
    color:#ddd;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
}

.control:hover{
    border-color:#9d0000;
    color:white;
}

/* ==================================================
   EJEMPLOS
================================================== */

.titulo-ejemplos{
    margin-top:25px;
    margin-bottom:10px;
    color:#aaa;
    font-size:14px;
}

.ejemplos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.ejemplo{
    padding:11px 8px;
    border:1px solid #292929;
    background:#0d0d0d;
    color:#bbb;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.ejemplo:hover{
    border-color:#970000;
    color:white;
    background:#171717;
}

/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:650px){

    .contenedor{
        width:96%;
        margin:12px auto;
    }

    .panel{
        padding:13px;
        border-radius:15px;
    }

    header{
        padding:15px 10px;
    }

    .logo{
        font-size:26px;
    }

    .chat{
        height:42vh;
        min-height:300px;
    }

    .entrada{

    }

@media(max-width:390px){

</style>

<script>
"use strict";

/* ==========================================================
   VARIABLES
========================================================== */

let reconocimiento = null;
let escuchando = false;
let vocesDisponibles = [];
let hablando = false;
let procesando = false;

let usuarioNombre = localStorage.getItem("elDesierto_nombre_usuario") || "";
let conversacion = [];

let colaVoz = [];
let indiceVoz = 0;

/* ==========================================================
   ELEMENTOS
========================================================== */

const $ = id => document.getElementById(id);

const estado = $("estado");
const chat = $("chat");
const pregunta = $("pregunta");
const btnEnviar = $("btnEnviar");
const microfono = $("microfono");

/* ==========================================================
   ESTADO
========================================================== */

function cambiarEstado(texto, tipo=""){
    if(!estado) return;

    estado.textContent = texto;

    estado.className = "estado";

    if(tipo){
        estado.classList.add(tipo);
    }
}

/* ==========================================================
   TEXTO
========================================================== */

function normalizar(texto){
    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();
}

function escaparHTML(texto){
    return String(texto || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function formatearNumero(numero){
    const n = Number(numero);

    if(!Number.isFinite(n)){
        return "0";
    }

    return n.toLocaleString("es-ES",{
        maximumFractionDigits:2
    });
}

/* ==========================================================
   CHAT
========================================================== */

function agregarMensaje(texto,tipo="asistente"){

    if(!chat) return;

    const div = document.createElement("div");

    div.className = "mensaje " + tipo;

    div.innerHTML = escaparHTML(texto)
        .replace(/\n/g,"<br>");

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

function limpiarConversacion(){

    if(!chat) return;

    chat.innerHTML = "";

    agregarMensaje(
        "Conversación limpiada. ¿En qué puedo ayudarte?"
    );
}

/* ==========================================================
   EMOJIS PARA LA VOZ
   IMPORTANTE:
   No usamos \p{Emoji...} porque puede provocar errores
   de sintaxis en navegadores antiguos.
========================================================== */

function limpiarTextoParaVoz(texto){

    let resultado = String(texto || "");

    resultado = resultado
        .replace(/https?:\/\/\S+/gi,"")
        .replace(/[#*_~`]/g,"")
        .replace(/[😀-🙏]/g,"")
        .replace(/[🌀-🫿]/g,"")
        .replace(/[☀-⛿]/g,"")
        .replace(/[✀-➿]/g,"")
        .replace(/[©®™♥❤⭐✨]/g,"");

    return resultado
        .replace(/\s+/g," ")
        .trim();
}

/* ==========================================================
   VOZ
========================================================== */

function cargarVoces(){

    if(!("speechSynthesis" in window)){
        return;
    }

    vocesDisponibles = speechSynthesis.getVoices() || [];
}

if("speechSynthesis" in window){

    cargarVoces();

    speechSynthesis.onvoiceschanged = cargarVoces;
}

function obtenerVozEspanol(){

    if(!vocesDisponibles.length){
        cargarVoces();
    }

    return vocesDisponibles.find(v =>
        /^es[-_]/i.test(v.lang)
    ) || null;
}

function detenerAudio(){

    try{

        if("speechSynthesis" in window){
            speechSynthesis.cancel();
        }

    }catch(error){

        console.warn("Error deteniendo voz:",error);
    }

    hablando = false;
    colaVoz = [];
    indiceVoz = 0;
}

function dividirTextoVoz(texto){

    const limpio = limpiarTextoParaVoz(texto);

    if(!limpio){
        return [];
    }

    const partes = limpio.match(/[^.!?]+[.!?]+|[^.!?]+$/g);

    return partes || [limpio];
}

function hablar(texto){

    detenerAudio();

    if(!("speechSynthesis" in window)){
        return;
    }

    const partes = dividirTextoVoz(texto);

    if(!partes.length){
        return;
    }

    colaVoz = partes;
    indiceVoz = 0;
    hablando = true;

    hablarSiguiente();
}

function hablarSiguiente(){

    if(!hablando){
        return;
    }

    if(indiceVoz >= colaVoz.length){

        hablando = false;
        colaVoz = [];
        indiceVoz = 0;

        return;
    }

    const texto = colaVoz[indiceVoz++];

    try{

        const utterance = new SpeechSynthesisUtterance(texto);

        utterance.lang = "es-ES";
        utterance.rate = 0.96;
        utterance.pitch = 1;
        utterance.volume = 1;

        const voz = obtenerVozEspanol();

        if(voz){
            utterance.voice = voz;
        }

        utterance.onend = hablarSiguiente;

        utterance.onerror = function(){
            hablarSiguiente();
        };

        speechSynthesis.speak(utterance);

    }catch(error){

        console.warn("Error de voz:",error);

        hablando = false;
    }
}

function probarVoz(){

    hablar(
        "Hola. Soy el asistente inteligente de ElDesierto. La prueba de voz funciona correctamente."
    );

    cambiarEstado(
        "Probando la voz...",
        "activo"
    );
}

/* ==========================================================
   SUPABASE
========================================================== */

function obtenerClienteSupabase(){

    try{

        if(typeof clienteSupabase !== "undefined" &&
           clienteSupabase){

            return clienteSupabase;
        }

    }catch(error){
        console.warn(error);
    }

    try{

        if(window.supabase &&
           typeof window.supabase.createClient === "function"){

            const url = localStorage.getItem("SUPABASE_URL");
            const key = localStorage.getItem("SUPABASE_KEY");

            if(url && key){
                return window.supabase.createClient(url,key);
            }
        }

    }catch(error){
        console.warn(error);
    }

    return null;
}

/* ==========================================================
   USUARIO ACTUAL
========================================================== */

async function obtenerUsuarioActual(){

    const cliente = obtenerClienteSupabase();

    if(!cliente){
        return null;
    }

    try{

        const {data,error} =
            await cliente.auth.getSession();

        if(error){
            console.warn(error);
            return null;
        }

        return data?.session?.user || null;

    }catch(error){

        console.warn(error);
        return null;
    }
}

/* ==========================================================
   INVENTARIO
========================================================== */

async function consultarInventario(){

    const cliente = obtenerClienteSupabase();

    if(!cliente){

        return {
            ok:false,
            texto:"No puedo consultar el inventario porque la conexión con la base de datos no está disponible."
        };
    }

    try{

        const {data,error} =
            await cliente
                .from("productos")
                .select("*")
                .order("id",{ascending:true});

        if(error){

            console.error(error);

            return {
                ok:false,
                texto:"No pude consultar el inventario en este momento."
            };
        }

        if(!data || !data.length){

            return {
                ok:true,
                texto:"No hay información registrada en el inventario."
            };
        }

        let texto = "Inventario actual:\n\n";

        data.forEach(producto => {

            const nombre =
                producto.Nombre ??
                producto.nombre ??
                producto.producto ??
                "Producto";

            const unidad =
                producto.Unidad ??
                producto.unidad ??
                "";

            const cantidad =
                producto.Cantidad ??
                producto.cantidad ??
                0;

            texto +=
                `${nombre}: ${formatearNumero(cantidad)} ${unidad}\n`;
        });

        return {
            ok:true,
            texto:texto.trim()
        };

    }catch(error){

        console.error(error);

        return {
            ok:false,
            texto:"Ocurrió un error consultando el inventario."
        };
    }
}

/* ==========================================================
   RECETAS
========================================================== */

async function consultarRecetas(){

    const cliente = obtenerClienteSupabase();

    if(!cliente){

        return {
            ok:false,
            texto:"No puedo consultar las recetas."
        };
    }

    try{

        const {data,error} =
            await cliente
                .from("recetas")
                .select("*")
                .order("id",{ascending:true});

        if(error){

            console.error(error);

            return {
                ok:false,
                texto:"No pude consultar las recetas."
            };
        }

        if(!data || !data.length){

            return {
                ok:true,
                texto:"No hay información registrada de recetas."
            };
        }

        let texto = "Recetas registradas:\n\n";

        data.forEach(receta => {

            const nombre =
                receta.nombre ??
                receta.Nombre ??
                "Receta";

            const resultado =
                receta.producto_resultado ??
                receta.Producto_resultado ??
                "";

            const cantidad =
                receta.cantidad_resultado ??
                receta.Cantidad_resultado ??
                "";

            texto += `${nombre}`;

            if(resultado){
                texto += ` → ${resultado}`;
            }

            if(cantidad !== ""){
                texto += ` (${formatearNumero(cantidad)})`;
            }

            texto += "\n";
        });

        return {
            ok:true,
            texto:texto.trim()
        };

    }catch(error){

        console.error(error);

        return {
            ok:false,
            texto:"Ocurrió un error consultando las recetas."
        };
    }
}

/* ==========================================================
   MOVIMIENTOS
========================================================== */

async function consultarMovimientos(){

    const cliente = obtenerClienteSupabase();

    if(!cliente){

        return {
            ok:false,
            texto:"No puedo consultar los movimientos."
        };
    }

    try{

        const {data,error} =
            await cliente
                .from("movimientos")
                .select("*")
                .order("Fecha",{ascending:false})
                .limit(10);

        if(error){

            console.error(error);

            return {
                ok:false,
                texto:"No pude consultar los últimos movimientos."
            };
        }

        if(!data || !data.length){

            return {
                ok:true,
                texto:"No hay información registrada de movimientos."
            };
        }

        let texto = "Últimos movimientos:\n\n";

        data.forEach(mov => {

            const fecha =
                mov.Fecha ??
                mov.fecha ??
                "";

            const producto =
                mov.Producto ??
                mov.producto ??
                "";

            const tipo =
                mov.Tipo ??
                mov.tipo ??
                "";

            const cantidad =
                mov.Cantidad ??
                mov.cantidad ??
                "";

            texto +=
                `${fecha} — ${tipo} — ${producto} — ${cantidad}\n`;
        });

        return {
            ok:true,
            texto:texto.trim()
        };

    }catch(error){

        console.error(error);

        return {
            ok:false,
            texto:"Ocurrió un error consultando los movimientos."
        };
    }
}

/* ==========================================================
   RESPUESTA CONVERSACIONAL
========================================================== */

function respuestaPersonalizada(texto){

    if(!usuarioNombre){
        return texto;
    }

    return `${usuarioNombre}, ${texto}`;
}

function esSaludo(t){

    return [
        "hola",
        "buenos dias",
        "buenas",
        "buenas tardes",
        "buenas noches",
        "saludos",
        "que tal",
        "como estas",
        "como esta"
    ].some(x => t.includes(x));
}

function esDespedida(t){

    return [
        "no",
        "nada",
        "eso es todo",
        "ya esta",
        "eso es todo gracias",
        "gracias eso es todo"
    ].includes(t);
}

async function procesarPregunta(textoOriginal){

    const texto = normalizar(textoOriginal);

    if(!texto){

        return "Puedes repetir la pregunta.";
    }

    /* ==============================================
       NOMBRE
    ============================================== */

    const patronesNombre = [
        /me llamo (.+)/i,
        /mi nombre es (.+)/i,
        /soy (.+)/i
    ];

    for(const patron of patronesNombre){

        const coincidencia = textoOriginal.match(patron);

        if(coincidencia){

            let nombre =
                coincidencia[1]
                    .trim()
                    .replace(/[.!?,]+$/,"");

            if(nombre.length > 1){

                usuarioNombre = nombre;

                localStorage.setItem(
                    "elDesierto_nombre_usuario",
                    usuarioNombre
                );

                return `Mucho gusto, ${usuarioNombre}. Ya sé cómo llamarte. ¿En qué puedo ayudarte?`;
            }
        }
    }

    /* ==============================================
       SALUDOS
    ============================================== */

    if(esSaludo(texto)){

        if(!usuarioNombre){

            return "Hola. Me alegra hablar contigo. Antes de continuar, ¿cómo te llamas?";
        }

        return `Hola, ${usuarioNombre}. Estoy listo para ayudarte con ElDesierto. ¿Qué necesitas consultar o hacer?`;
    }

    /* ==============================================
       DESPEDIDA
    ============================================== */

    if(esDespedida(texto)){

        if(usuarioNombre){

            return `De acuerdo, ${usuarioNombre}. Me alegra haberte ayudado. Puedes consultarme cuando necesites algo en ElDesierto. Hasta luego.`;
        }

        return "De acuerdo. Puedes consultarme cuando necesites algo en ElDesierto. Hasta luego.";
    }

    /* ==============================================
       IDENTIDAD
    ============================================== */

    if(
        texto.includes("quien eres") ||
        texto.includes("que eres") ||
        texto.includes("como te llamas")
    ){

        return "Soy el asistente inteligente de ElDesierto. Puedo consultar la información registrada y ayudarte a realizar operaciones que estén conectadas al sistema.";
    }

    /* ==============================================
       AGRADECIMIENTO
    ============================================== */

    if(
        texto.includes("gracias") ||
        texto.includes("muchas gracias")
    ){

        return usuarioNombre
            ? `De nada, ${usuarioNombre}. ¿Necesitas algo más?`
            : "De nada. ¿Necesitas algo más?";
    }

    /* ==============================================
       INVENTARIO
    ============================================== */

    if(
        texto.includes("inventario") ||
        texto.includes("existencias") ||
        texto.includes("cuanto tenemos") ||
        texto.includes("cuanta materia")
    ){

        const resultado = await consultarInventario();

        return resultado.texto +
            "\n\n¿Necesitas consultar algún producto en particular?";
    }

    /* ==============================================
       MATERIALES
    ============================================== */

    if(
        texto.includes("materiales de construccion") ||
        texto.includes("materiales de construccion")
    ){

        const resultado = await consultarMateriales();

        return resultado.texto +
            "\n\n¿Quieres consultar algún material específico?";
    }

    /* ==============================================
       PRODUCTOS ELABORADOS
    ============================================== */

    if(
        texto.includes("productos elaborados") ||
        texto.includes("productos fabricados") ||
        texto.includes("productos terminados")
    ){

        const resultado =
            await consultarProductosElaborados();

        return resultado.texto +
            "\n\n¿Quieres consultar algún producto elaborado?";
    }

    /* ==============================================
       RECETAS
    ============================================== */

    if(
        texto.includes("recetas") ||
        texto.includes("receta")
    ){

        const resultado = await consultarRecetas();

        return resultado.texto +
            "\n\n¿Quieres consultar los ingredientes de alguna receta?";
    }

    /* ==============================================
       MOVIMIENTOS
    ============================================== */

    if(
        texto.includes("ultimas salidas") ||
        texto.includes("ultimos movimientos") ||
        texto.includes("movimientos recientes") ||
        texto.includes("historial")
    ){

        const resultado =
            await consultarMovimientos();

        return resultado.texto +
            "\n\n¿Quieres consultar un período específico?";
    }

    /* ==============================================
       PREGUNTAS SOBRE CÓMO ESTÁ
    ============================================== */

    if(
        texto.includes("como va el negocio") ||
        texto.includes("como va el negocio") ||
        texto.includes("como esta el negocio")
    ){

        return "Puedo revisar los datos registrados de ElDesierto, como inventarios, productos elaborados, movimientos, recetas y demás información disponible. Dime qué parte quieres consultar.";
    }

    /* ==============================================
       ACCIONES — POR AHORA NO INVENTAMOS COLUMNAS
       ============================================== */

    if(
        texto.includes("entrada de mercancia") ||
        texto.includes("hacer una entrada")
    ){

        return "Puedo ayudarte a realizar una entrada de mercancía, pero para ejecutarla correctamente necesito utilizar la estructura exacta de la tabla de movimientos y registrar todos los datos correspondientes. Dime qué producto y cantidad quieres registrar.";
    }

    if(
        texto.includes("salida de mercancia") ||
        texto.includes("hacer una salida")
    ){

        return "Puedo ayudarte a realizar una salida de mercancía. Dime el producto y la cantidad que quieres sacar.";
    }

    if(
        texto.includes("fabricar") ||
        texto.includes("fabricacion") ||
        texto.includes("elaborar")
    ){

        return "Puedo ayudarte con una fabricación. Dime qué receta quieres utilizar y cuántos kilogramos quieres fabricar.";
    }

    /* ==============================================
       PREGUNTA DESCONOCIDA
    ============================================== */

    return "No entendí completamente la pregunta. Puedes repetirla o decirme qué información de ElDesierto necesitas consultar.";
}

/* ==========================================================
   ENVIAR PREGUNTA
========================================================== */

async function enviarPregunta(){

    if(procesando){
        return;
    }

    const texto = pregunta
        ? pregunta.value.trim()
        : "";

    if(!texto){

        cambiarEstado(
            "Escribe una pregunta primero.",
            "error"
        );

        if(pregunta){
            pregunta.focus();
        }

        return;
    }

    procesando = true;

    if(btnEnviar){
        btnEnviar.disabled = true;
        btnEnviar.textContent = "Procesando...";
    }

    agregarMensaje(texto,"usuario");

    if(pregunta){
        pregunta.value = "";
    }

    cambiarEstado(
        "Consultando ElDesierto...",
        "activo"
    );

    try{

        const respuesta =
            await procesarPregunta(texto);

        agregarMensaje(respuesta,"asistente");

        hablar(respuesta);

        cambiarEstado(
            "Asistente listo",
            "exito"
        );

        conversacion.push({
            usuario:texto,
            asistente:respuesta,
            fecha:new Date().toISOString()
        });

        try{

            localStorage.setItem(
                "elDesierto_conversacion",
                JSON.stringify(conversacion.slice(-30))
            );

        }catch(error){
            console.warn(error);
        }

    }catch(error){

        console.error("ERROR ASISTENTE:",error);

        const respuesta =
            "Ocurrió un problema al procesar la pregunta. Puedes repetirla.";

        agregarMensaje(respuesta,"asistente");

        cambiarEstado(
            "Se produjo un error",
            "error"
        );

        hablar(respuesta);

    }finally{

        procesando = false;

        if(btnEnviar){

            btnEnviar.disabled = false;
            btnEnviar.textContent = "Enviar";
        }

        if(pregunta){
            pregunta.focus();
        }
    }
}

/* ==========================================================
   RECONOCIMIENTO DE VOZ
========================================================== */

function prepararReconocimiento(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        reconocimiento = null;

        return false;
    }

    if(reconocimiento){
        return true;
    }

    try{

        reconocimiento = new SpeechRecognition();

        reconocimiento.lang = "es-ES";
        reconocimiento.continuous = false;
        reconocimiento.interimResults = true;
        reconocimiento.maxAlternatives = 1;

        reconocimiento.onstart = function(){

            escuchando = true;

            if(microfono){
                microfono.classList.add("escuchando");
                microfono.textContent = "🔴";
            }

            cambiarEstado(
                "Te estoy escuchando...",
                "activo"
            );
        };

        reconocimiento.onresult = function(event){

            let resultadoFinal = "";

            for(
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ){

                const resultado =
                    event.results[i][0].transcript;

                if(event.results[i].isFinal){

                    resultadoFinal += resultado;
                }
            }

            if(resultadoFinal.trim()){

                if(pregunta){
                    pregunta.value =
                        resultadoFinal.trim();
                }

                enviarPregunta();
            }
        };

        reconocimiento.onerror = function(event){

            console.warn(
                "Reconocimiento de voz:",
                event.error
            );

            escuchando = false;

            if(microfono){
                microfono.classList.remove("escuchando");
                microfono.textContent = "🎙️";
            }

            let mensaje =
                "No pude escuchar correctamente.";

            if(event.error === "not-allowed"){
                mensaje =
                    "El navegador no tiene permiso para usar el micrófono.";
            }

            if(event.error === "no-speech"){
                mensaje =
                    "No detecté ninguna voz. Puedes intentarlo nuevamente.";
            }

            if(event.error === "audio-capture"){
                mensaje =
                    "No encontré un micrófono disponible.";
            }

            cambiarEstado(
                mensaje,
                "error"
            );
        };

        reconocimiento.onend = function(){

            escuchando = false;

            if(microfono){
                microfono.classList.remove("escuchando");
                microfono.textContent = "🎙️";
            }

            if(
                estado &&
                estado.classList.contains("activo")
            ){

                cambiarEstado(
                    "Asistente listo"
                );
            }
        };

        return true;

    }catch(error){

        console.error(
            "No se pudo preparar reconocimiento:",
            error
        );

        reconocimiento = null;

        return false;
    }
}

/* ==========================================================
   INICIAR ESCUCHA
========================================================== */

function iniciarEscucha(){

    const disponible =
        prepararReconocimiento();

    if(!disponible){

        cambiarEstado(
            "El navegador no permite reconocimiento de voz. Puedes escribir la pregunta.",
            "error"
        );

        agregarMensaje(
            "El reconocimiento de voz no está disponible en este navegador. Puedes seguir usando el campo de texto.",
            "asistente"
        );

        return;
    }

    if(escuchando){

        try{
            reconocimiento.stop();
        }catch(error){
            console.warn(error);
        }

        return;
    }

    try{

        reconocimiento.start();

    }catch(error){

        console.warn(
            "Error iniciando micrófono:",
            error
        );

        /*
         * Algunos navegadores lanzan InvalidStateError
         * si start() se llama demasiado rápido.
         */
        setTimeout(function(){

            try{

                if(!escuchando){
                    reconocimiento.start();
                }

            }catch(error2){

                console.error(error2);

                cambiarEstado(
                    "No pude iniciar el micrófono. Inténtalo nuevamente.",
                    "error"
                );
            }

        },300);
    }
}

/* ==========================================================
   TECLA ENTER
========================================================== */

function manejarTecla(event){

    if(!event){
        return;
    }

    if(event.key === "Enter"){

        event.preventDefault();

        enviarPregunta();
    }
}

/* ==========================================================
   ERRORES GLOBALES
   Esto evita que un error quede invisible.
========================================================== */

window.addEventListener(
    "error",
    function(event){

        console.error(
            "Error JavaScript:",
            event.error || event.message
        );

        cambiarEstado(
            "Se produjo un error en el asistente.",
            "error"
        );
    }
);

window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "Promesa rechazada:",
            event.reason
        );

        cambiarEstado(
            "Se produjo un error de conexión.",
            "error"
        );
    }
);

/* ==========================================================
   INICIO
========================================================== */

function iniciarAsistente(){

    try{

        try{

            const guardada =
                localStorage.getItem(
                    "elDesierto_conversacion"
                );

            if(guardada){

                const datos =
                    JSON.parse(guardada);

                if(Array.isArray(datos)){
                    conversacion = datos;
                }
            }

        }catch(error){

            console.warn(
                "No se pudo recuperar conversación:",
                error
            );
        }

        prepararReconocimiento();

        cargarVoces();

        cambiarEstado(
            "Asistente listo",
            "exito"
        );

        if(pregunta){
            pregunta.focus();
        }

        console.log(
            "ElDesierto: asistente iniciado correctamente."
        );

    }catch(error){

        console.error(
            "Error iniciando asistente:",
            error
        );

        cambiarEstado(
            "El asistente inició con advertencias.",
            "error"
        );
    }
}

if(
    document.readyState === "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        iniciarAsistente
    );

}else{

    iniciarAsistente();
}

/* ==========================================================
   DISPONIBLES GLOBALMENTE
   Por seguridad, aunque algún navegador procese los
   eventos inline de manera diferente.
========================================================== */

window.enviarPregunta = enviarPregunta;
window.iniciarEscucha = iniciarEscucha;
window.manejarTecla = manejarTecla;
window.probarVoz = probarVoz;
window.detenerAudio = detenerAudio;
window.limpiarConversacion = limpiarConversacion;

</script>
