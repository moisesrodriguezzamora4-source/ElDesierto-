<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Asistente IA - ElDesierto</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f1ea;
    color:#2d241e;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:20px;
}

.encabezado{
    background:#30251e;
    color:white;
    border-radius:20px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 6px 18px rgba(0,0,0,.15);
}

.encabezado h1{
    font-size:25px;
    margin-bottom:6px;
}

.encabezado p{
    color:#d9c9a5;
    font-size:14px;
}

.tarjeta{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.titulo{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.mic-container{
    display:flex;
    justify-content:center;
    margin:10px 0 20px;
}

#botonMicrofono{
    width:90px;
    height:90px;
    border-radius:50%;
    border:none;
    background:#8b2f23;
    color:white;
    font-size:38px;
    cursor:pointer;
    box-shadow:0 6px 15px rgba(139,47,35,.3);
}

#botonMicrofono.escuchando{
    animation:pulsar 1s infinite;
    background:#c0392b;
}

@keyframes pulsar{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }

}

.input-container{
    display:flex;
    gap:8px;
}

#pregunta{
    flex:1;
    border:1px solid #ddd;
    border-radius:12px;
    padding:14px;
    font-size:16px;
    outline:none;
}

#pregunta:focus{
    border-color:#8b2f23;
}

#botonEnviar{
    border:none;
    border-radius:12px;
    padding:0 18px;
    background:#8b2f23;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.estado{
    text-align:center;
    margin-top:12px;
    font-size:13px;
    color:#777;
}

.respuesta{
    background:#f8f5ef;
    border-radius:15px;
    padding:18px;
    line-height:1.6;
    white-space:pre-line;
    min-height:70px;
}

.respuesta.exito{
    border-left:5px solid #6c8b45;
}

.botonEscuchar{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:13px;
    background:#30251e;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.botonEscuchar.reproduciendo{
    background:#6c8b45;
}

.ejemplos{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
}

.ejemplo{
    border:1px solid #ddd;
    background:#fafafa;
    padding:13px;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
    font-size:14px;
}

.ejemplo:active{
    transform:scale(.98);
}

.volver{
    width:100%;
    padding:14px;
    border:none;
    border-radius:13px;
    background:#8b2f23;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="contenedor">

    <div class="encabezado">

        <h1>🤖 Asistente IA</h1>

        <p>
            Asistente inteligente de ElDesierto
        </p>

    </div>


    <div class="tarjeta">

        <div class="titulo">
            🎙️ Hazle una pregunta
        </div>


        <div class="mic-container">

            <button
            id="botonMicrofono"
            onclick="iniciarVoz()">

                🎤

            </button>

        </div>


        <div class="input-container">

            <input
            id="pregunta"
            type="text"
            placeholder="Escribe tu pregunta..."
            onkeydown="if(event.key==='Enter') procesarPregunta()">

            <button
            id="botonEnviar"
            onclick="procesarPregunta()">

                Enviar

            </button>

        </div>


        <div
        id="estado"
        class="estado">

            Listo para ayudarte

        </div>

    </div>


    <div class="tarjeta">

        <div class="titulo">
            💬 Respuesta
        </div>

        <div
        id="respuestaTexto"
        class="respuesta">

            Aquí aparecerá la respuesta.

        </div>


        <button
        id="botonEscuchar"
        class="botonEscuchar"
        onclick="escucharRespuesta()">

            🔊 Escuchar respuesta

        </button>

    </div>


    <div class="tarjeta">

        <div class="titulo">
            💡 Ejemplos
        </div>


        <div class="ejemplos">

            <button
            class="ejemplo"
            onclick="usarEjemplo('¿Cuánto inventario tengo?')">

                📦 ¿Cuánto inventario tengo?

            </button>


            <button
            class="ejemplo"
            onclick="usarEjemplo('¿Qué productos tengo?')">

                🌽 ¿Qué productos tengo?

            </button>


            <button
            class="ejemplo"
            onclick="usarEjemplo('¿Qué materiales de construcción tengo?')">

                🏗️ ¿Qué materiales de construcción tengo?

            </button>


            <button
            class="ejemplo"
            onclick="usarEjemplo('¿Cuántos cerdos hay?')">

                🐷 ¿Cuántos cerdos hay?

            </button>


            <button
            class="ejemplo"
            onclick="usarEjemplo('¿Cuáles son mis recetas?')">

                📋 ¿Cuáles son mis recetas?

            </button>


            <button
            class="ejemplo"
            onclick="usarEjemplo('¿Qué movimientos se han realizado hoy?')">

                📊 ¿Qué movimientos se han realizado hoy?

            </button>

        </div>

    </div>


    <button
    class="volver"
    onclick="history.back()">

        ← Volver

    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let ultimaRespuesta = "";

let reconocimiento = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const pregunta =
document.getElementById("pregunta");

const respuestaTexto =
document.getElementById("respuestaTexto");

const estado =
document.getElementById("estado");

const botonMicrofono =
document.getElementById("botonMicrofono");

const botonEscuchar =
document.getElementById("botonEscuchar");


/* =====================================================
   SUPABASE
===================================================== */

let db = null;

try{

    if(typeof supabase !== "undefined"){

        if(
            typeof supabase.from === "function"
        ){

            db = supabase;

        }

    }

}catch(error){

    console.error(
        "Error iniciando Supabase:",
        error
    );

}


/* =====================================================
   EJEMPLO
===================================================== */

function usarEjemplo(texto){

    pregunta.value = texto;

    procesarPregunta();

}


/* =====================================================
   RECONOCIMIENTO DE VOZ
===================================================== */

function iniciarVoz(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        estado.innerText =
        "⚠️ Este navegador no admite reconocimiento de voz.";

        return;

    }


    reconocimiento =
    new SpeechRecognition();


    reconocimiento.lang =
    "es-ES";

    reconocimiento.continuous =
    false;

    reconocimiento.interimResults =
    true;


    reconocimiento.onstart =
    function(){

        botonMicrofono.classList.add(
            "escuchando"
        );

        botonMicrofono.innerText =
        "🔴";

        estado.innerText =
        "🎤 Escuchando...";

    };


    reconocimiento.onresult =
    function(event){

        let texto = "";

        for(
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ){

            texto +=
            event.results[i][0].transcript;

        }

        pregunta.value =
        texto.trim();

    };


    reconocimiento.onerror =
    function(event){

        console.error(
            "Error reconocimiento:",
            event.error
        );

        estado.innerText =
        "⚠️ Error del micrófono: " +
        event.error;

    };


    reconocimiento.onend =
    function(){

        botonMicrofono.classList.remove(
            "escuchando"
        );

        botonMicrofono.innerText =
        "🎤";

        if(pregunta.value.trim()){

            procesarPregunta();

        }else{

            estado.innerText =
            "Listo para ayudarte";

        }

    };


    reconocimiento.start();

}


/* =====================================================
   BUSCAR PRODUCTO
===================================================== */

async function buscarProducto(nombre){

    if(!db){

        return null;

    }


    const {data,error} =
    await db
    .from("productos")
    .select(
        "Identificación,Nombre,Unidad,Cantidad"
    )
    .order("Nombre");


    if(error){

        console.error(
            "Error productos:",
            error
        );

        return null;

    }


    const buscado =
    nombre
    .toLowerCase()
    .trim();


    return data.find(producto =>

        String(producto.Nombre)
        .toLowerCase()
        .includes(buscado)

    ) || null;

}


/* =====================================================
   BUSCAR MATERIAL
===================================================== */

async function buscarMaterial(nombre){

    if(!db){

        return null;

    }


    const {data,error} =
    await db
    .from("materiales_construccion")
    .select(
        "id,Nombre,Unidad,Cantidad"
    )
    .order("Nombre");


    if(error){

        console.error(
            "Error materiales:",
            error
        );

        return null;

    }


    const buscado =
    nombre
    .toLowerCase()
    .trim();


    return data.find(material =>

        String(material.Nombre)
        .toLowerCase()
        .includes(buscado)

    ) || null;

}


/* =====================================================
   INVENTARIO COMPLETO
===================================================== */

async function obtenerInventario(){

    if(!db){

        return [];

    }


    const {data,error} =
    await db
    .from("productos")
    .select(
        "Nombre,Unidad,Cantidad"
    )
    .order("Nombre");


    if(error){

        console.error(
            "Error inventario:",
            error
        );

        return [];

    }


    return data || [];

}


/* =====================================================
   MATERIALES DE CONSTRUCCIÓN
===================================================== */

async function obtenerMateriales(){

    if(!db){

        return [];

    }


    const {data,error} =
    await db
    .from("materiales_construccion")
    .select(
        "Nombre,Unidad,Cantidad"
    )
    .order("Nombre");


    if(error){

        console.error(
            "Error materiales:",
            error
        );

        return [];

    }


    return data || [];

}


/* =====================================================
   MOVIMIENTOS DE HOY
===================================================== */

async function movimientosHoy(){

    if(!db){

        return [];

    }


    const inicio =
    new Date();

    inicio.setHours(
        0,0,0,0
    );


    const {data,error} =
    await db
    .from("movimientos")
    .select("*")
    .gte(
        "Fecha",
        inicio.toISOString()
    )
    .order(
        "Fecha",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "Error movimientos:",
            error
        );

        return [];

    }


    return data || [];

}


/* =====================================================
   CANTIDAD DE CERDOS
===================================================== */

async function cantidadCerdos(){

    if(!db){

        return 0;

    }


    const {data,error} =
    await db
    .from("cuartones")
    .select(
        "cantidad_cerdos"
    );


    if(error){

        console.error(
            "Error cerdos:",
            error
        );

        return 0;

    }


    let total = 0;


    (data || []).forEach(cuarton =>{

        total +=
        Number(
            cuarton.cantidad_cerdos
        ) || 0;

    });


    return total;

}


/* =====================================================
   RECETAS
===================================================== */

async function obtenerRecetas(){

    if(!db){

        return [];

    }


    const {data,error} =
    await db
    .from("recetas")
    .select(
        "nombre,producto_resultado,cantidad_resultado"
    )
    .order("nombre");


    if(error){

        console.error(
            "Error recetas:",
            error
        );

        return [];

    }


    return data || [];

}


/* =====================================================
   FORMATEAR NÚMERO
===================================================== */

function formatearNumero(numero){

    const n =
    Number(numero) || 0;


    return n.toLocaleString(
        "es-ES",
        {
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   RESPUESTA
===================================================== */

function mostrarRespuesta(texto){

    respuestaTexto.className =
    "respuesta exito";

    respuestaTexto.innerText =
    texto;


    ultimaRespuesta =
    texto;


    botonEscuchar.innerText =
    "🔊 Escuchar respuesta";


    botonEscuchar.classList.remove(
        "reproduciendo"
    );


    estado.innerText =
    "✅ Consulta completada";

}


/* =====================================================
   HABLAR MANUALMENTE
===================================================== */

function escucharRespuesta(){

    if(!ultimaRespuesta){

        estado.innerText =
        "⚠️ No hay ninguna respuesta para reproducir.";

        return;

    }


    if(
        !("speechSynthesis" in window)
    ){

        estado.innerText =
        "⚠️ Este navegador no admite síntesis de voz.";

        return;

    }


    const synth =
    window.speechSynthesis;


    synth.cancel();


    let voces =
    synth.getVoices();


    function reproducir(){

        voces =
        synth.getVoices();


        if(
            !voces ||
            voces.length === 0
        ){

            estado.innerText =
            "⚠️ Chrome no tiene ninguna voz disponible.";

            console.error(
                "No hay voces disponibles."
            );

            return;

        }


        /* =============================================
           BUSCAR VOZ ESPAÑOLA
        ============================================= */

        let voz =
        voces.find(v =>

            v.lang &&
            v.lang
            .toLowerCase()
            .startsWith("es")

        );


        /* =============================================
           SEGUNDA OPCIÓN
        ============================================= */

        if(!voz){

            voz =
            voces.find(v =>

                v.lang &&
                v.lang
                .toLowerCase()
                .includes("spa")

            );

        }


        /* =============================================
           ÚLTIMA OPCIÓN
        ============================================= */

        if(!voz){

            voz =
            voces.find(v =>
                v.default
            ) ||
            voces[0];

        }


        console.log(
            "Voz seleccionada:",
            voz.name,
            voz.lang
        );


        /* =============================================
           DIVIDIR RESPUESTA
        ============================================= */

        const partes =
        ultimaRespuesta.match(
            /[^.!?]+[.!?]+|[^.!?]+$/g
        ) || [ultimaRespuesta];


        let posicion = 0;


        /* =============================================
           SIGUIENTE FRASE
        ============================================= */

        function siguiente(){

            if(
                posicion >=
                partes.length
            ){

                botonEscuchar.innerText =
                "🔊 Escuchar respuesta";

                botonEscuchar.classList.remove(
                    "reproduciendo"
                );

                estado.innerText =
                "✅ Consulta completada";

                return;

            }


            const texto =
            partes[posicion]
            .trim();


            posicion++;


            if(!texto){

                siguiente();

                return;

            }


            const mensaje =
            new SpeechSynthesisUtterance(
                texto
            );


            mensaje.voice =
            voz;


            mensaje.lang =
            voz.lang ||
            "es-ES";


            mensaje.rate =
            0.9;


            mensaje.pitch =
            1;


            mensaje.volume =
            1;


            mensaje.onstart =
            function(){

                botonEscuchar.innerText =
                "🔊 Reproduciendo...";


                botonEscuchar.classList.add(
                    "reproduciendo"
                );


                estado.innerText =
                "🔊 Reproduciendo respuesta...";

            };


            mensaje.onend =
            function(){

                setTimeout(
                    siguiente,
                    100
                );

            };


            mensaje.onerror =
            function(event){

                console.error(
                    "ERROR DE VOZ:",
                    event
                );


                console.error(
                    "Código:",
                    event.error
                );


                botonEscuchar.innerText =
                "🔊 Escuchar respuesta";


                botonEscuchar.classList.remove(
                    "reproduciendo"
                );


                estado.innerText =
                "⚠️ Error de voz: " +
                event.error;

            };


            synth.speak(
                mensaje
            );

        }


        siguiente();

    }


    /* =============================================
       LAS VOCES PUEDEN TARDAR EN CARGAR
    ============================================= */

    if(voces.length > 0){

        reproducir();

    }else{

        let ejecutado = false;


        synth.onvoiceschanged =
        function(){

            if(ejecutado){

                return;

            }


            ejecutado = true;


            synth.onvoiceschanged =
            null;


            reproducir();

        };


        setTimeout(
            function(){

                if(!ejecutado){

                    ejecutado = true;

                    synth.onvoiceschanged =
                    null;

                    reproducir();

                }

            },
            1500
        );

    }

}


/* =====================================================
   PROCESAR PREGUNTA
===================================================== */

async function procesarPregunta(){

    const texto =
    pregunta.value
    .trim()
    .toLowerCase();


    if(!texto){

        estado.innerText =
        "⚠️ Escribe o di una pregunta.";

        return;

    }


    estado.innerText =
    "🔎 Consultando ElDesierto...";


    try{

        /* =============================================
           INVENTARIO TOTAL
        ============================================= */

        if(
            texto.includes("inventario") &&
            (
                texto.includes("cuánto") ||
                texto.includes("cuanto") ||
                texto.includes("cantidad") ||
                texto.includes("existencia") ||
                texto.includes("tengo")
            )
        ){

            const inventario =
            await obtenerInventario();


            if(inventario.length === 0){

                mostrarRespuesta(
                    "No hay productos registrados en el inventario."
                );

                return;

            }


            let respuesta =
            "📦 Inventario actual:\n\n";


            inventario.forEach(producto =>{

                respuesta +=
                "• " +
                producto.Nombre +
                ": " +
                formatearNumero(
                    producto.Cantidad
                ) +
                " " +
                (
                    producto.Unidad ||
                    ""
                ) +
                "\n";

            });


            mostrarRespuesta(
                respuesta
            );

            return;

        }


        /* =============================================
           LISTA DE PRODUCTOS
        ============================================= */

        if(
            texto.includes("qué productos") ||
            texto.includes("que productos") ||
            texto.includes("productos tengo") ||
            texto.includes("productos hay")
        ){

            const inventario =
            await obtenerInventario();


            let respuesta =
            "🌽 Productos registrados:\n\n";


            if(inventario.length === 0){

                respuesta +=
                "No hay productos registrados.";

            }else{

                inventario.forEach(producto =>{

                    respuesta +=
                    "• " +
                    producto.Nombre +
                    " — " +
                    formatearNumero(
                        producto.Cantidad
                    ) +
                    " " +
                    (
                        producto.Unidad ||
                        ""
                    ) +
                    "\n";

                });

            }


            mostrarRespuesta(
                respuesta
            );

            return;

        }


        /* =============================================
           MATERIALES DE CONSTRUCCIÓN
        ============================================= */

        if(
            texto.includes("materiales de construcción") ||
            texto.includes("materiales de construccion") ||
            texto.includes("construcción") ||
            texto.includes("construccion")
        ){

            const materiales =
            await obtenerMateriales();


            let respuesta =
            "🏗️ Materiales de construcción:\n\n";


            if(materiales.length === 0){

                respuesta +=
                "No hay materiales registrados.";

            }else{

                materiales.forEach(material =>{

                    respuesta +=
                    "• " +
                    material.Nombre +
                    ": " +
                    formatearNumero(
                        material.Cantidad
                    ) +
                    " " +
                    (
                        material.Unidad ||
                        ""
                    ) +
                    "\n";

                });

            }


            mostrarRespuesta(
                respuesta
            );

            return;

        }


        /* =============================================
           CERDOS
        ============================================= */

        if(
            texto.includes("cerdos") ||
            texto.includes("cerdo") ||
            texto.includes("animales")
        ){

            const total =
            await cantidadCerdos();


            mostrarRespuesta(
                "🐷 Actualmente hay " +
                formatearNumero(total) +
                " cerdos registrados en las naves."
            );

            return;

        }


        /* =============================================
           RECETAS
        ============================================= */

        if(
            texto.includes("recetas") ||
            texto.includes("receta")
        ){

            const recetas =
            await obtenerRecetas();


            let respuesta =
            "📋 Recetas registradas:\n\n";


            if(recetas.length === 0){

                respuesta +=
                "No hay recetas registradas.";

            }else{

                recetas.forEach(receta =>{

                    respuesta +=
                    "• " +
                    receta.nombre +
                    " → " +
                    receta.producto_resultado +
                    " (" +
                    formatearNumero(
                        receta.cantidad_resultado
                    ) +
                    ")\n";

                });

            }


            mostrarRespuesta(
                respuesta
            );

            return;

        }


        /* =============================================
           MOVIMIENTOS DE HOY
        ============================================= */

        if(
            texto.includes("movimientos") &&
            (
                texto.includes("hoy") ||
                texto.includes("día") ||
                texto.includes("dia")
            )
        ){

            const movimientos =
            await movimientosHoy();


            let respuesta =
            "📊 Movimientos de hoy:\n\n";


            if(movimientos.length === 0){

                respuesta +=
                "No hay movimientos registrados hoy.";

            }else{

                movimientos.forEach(movimiento =>{

                    const producto =
                    movimiento.Producto ||
                    movimiento.producto ||
                    "Producto";


                    const tipo =
                    movimiento.Tipo ||
                    movimiento.tipo ||
                    "";


                    const cantidad =
                    movimiento.Cantidad ||
                    movimiento.cantidad ||
                    0;


                    respuesta +=
                    "• " +
                    tipo +
                    " — " +
                    producto +
                    " — " +
                    formatearNumero(
                        cantidad
                    ) +
                    "\n";

                });

            }


            mostrarRespuesta(
                respuesta
            );

            return;

        }


        /* =============================================
           PRODUCTO ESPECÍFICO
        ============================================= */

        const nombresProductos = [
            "maíz",
            "maiz",
            "soya",
            "soja",
            "cebada",
            "salvado",
            "sal",
            "calcio",
            "premezcla",
            "miel",
            "palmiche",
            "chícharo",
            "chicharo",
            "pienso"
        ];


        for(
            const nombre of nombresProductos
        ){

            if(
                texto.includes(nombre)
            ){

                const producto =
                await buscarProducto(
                    nombre
                );


                if(producto){

                    mostrarRespuesta(
                        "📦 " +
                        producto.Nombre +
                        " tiene actualmente " +
                        formatearNumero(
                            producto.Cantidad
                        ) +
                        " " +
                        (
                            producto.Unidad ||
                            ""
                        ) +
                        " en inventario."
                    );

                    return;

                }

            }

        }


        /* =============================================
           AYUDA GENERAL
        ============================================= */

        mostrarRespuesta(
            "🤖 Puedo ayudarte a consultar ElDesierto.\n\n" +

            "Puedes preguntarme, por ejemplo:\n" +

            "• ¿Cuánto inventario tengo?\n" +

            "• ¿Qué productos tengo?\n" +

            "• ¿Cuánto maíz tengo?\n" +

            "• ¿Qué materiales de construcción tengo?\n" +

            "• ¿Cuántos cerdos hay?\n" +

            "• ¿Cuáles son mis recetas?\n" +

            "• ¿Qué movimientos se han realizado hoy?"
        );


    }catch(error){

        console.error(
            "Error procesando pregunta:",
            error
        );


        mostrarRespuesta(
            "⚠️ Ocurrió un error al consultar los datos de ElDesierto."
        );

    }

}

</script>
