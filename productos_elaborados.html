<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Productos elaborados - ElDesierto</title>

<style>

/* ==================================================
   CONFIGURACIÓN GENERAL
================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#3b0000 0%,#140000 45%,#000 100%);
    color:white;
    padding:20px;
}

/* ==================================================
   CONTENEDOR
================================================== */

.contenedor{
    max-width:1000px;
    margin:auto;
}

/* ==================================================
   ENCABEZADO
================================================== */

.encabezado{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    font-size:45px;
    margin-bottom:5px;
}

.marca{
    font-size:30px;
    font-weight:bold;
    color:#ff1a1a;
    text-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff0000,
        0 0 30px #8b0000;
}

.subtitulo{
    color:#ccc;
    font-size:15px;
    margin-top:5px;
}

.titulo{
    margin-top:25px;
    font-size:28px;
    color:#ff2222;
    text-shadow:0 0 12px #ff0000;
}

.descripcion{
    margin-top:8px;
    color:#bbb;
}

/* ==================================================
   BOTÓN VOLVER
================================================== */

.boton-volver{
    display:inline-block;
    margin:20px 0;
    padding:12px 22px;
    border:none;
    border-radius:10px;
    background:linear-gradient(145deg,#ff2222,#8b0000);
    color:white;
    font-weight:bold;
    text-decoration:none;
    box-shadow:
        0 5px 0 #450000,
        0 8px 18px rgba(255,0,0,.35);
    transition:.2s;
}

.boton-volver:hover{
    transform:translateY(-2px);
}

/* ==================================================
   PANEL
================================================== */

.panel{
    background:
        linear-gradient(145deg,#1a1a1a,#070707);
    border:1px solid #550000;
    border-radius:18px;
    padding:20px;
    box-shadow:
        0 15px 35px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.05);
    overflow-x:auto;
}

/* ==================================================
   TABLA
================================================== */

table{
    width:100%;
    min-width:800px;
    border-collapse:collapse;
}

thead{
    background:linear-gradient(180deg,#a00000,#520000);
}

th{
    padding:14px 10px;
    color:white;
    font-size:14px;
    border-bottom:2px solid #ff2222;
}

td{
    padding:13px 10px;
    text-align:center;
    border-bottom:1px solid #292929;
    color:#ddd;
}

tbody tr:hover{
    background:rgba(255,0,0,.07);
}

/* ==================================================
   BOTONES
================================================== */

button{
    font-family:inherit;
}

.boton-consumir{
    border:none;
    border-radius:8px;
    padding:9px 13px;
    background:linear-gradient(145deg,#ff2222,#8b0000);
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:
        0 4px 0 #450000,
        0 5px 12px rgba(255,0,0,.3);
}

.boton-consumir:hover{
    transform:translateY(-1px);
}

.boton-eliminar{
    border:none;
    border-radius:8px;
    padding:9px 13px;
    background:linear-gradient(145deg,#444,#151515);
    color:#ff3333;
    font-weight:bold;
    cursor:pointer;
    border:1px solid #650000;
}

.boton-eliminar:hover{
    background:#300000;
}

/* ==================================================
   MENÚ CONSUMO
================================================== */

.menu-consumo{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    z-index:1000;
    align-items:center;
    justify-content:center;
}

.menu-consumo.activo{
    display:flex;
}

.boton-opcion{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:none;
    border-radius:10px;
    background:linear-gradient(145deg,#ff2222,#7b0000);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.boton-opcion:hover{
    filter:brightness(1.15);
}

/* ==================================================
   MENÚ DESTINOS
================================================== */

.menu-destinos{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    z-index:1100;
    align-items:center;
    justify-content:center;
}

.menu-destinos.activo{
    display:flex;
}

.titulo-destinos{
    color:#ff2222;
    text-align:center;
    font-size:22px;
    margin-bottom:15px;
    text-shadow:0 0 10px #ff0000;
}

.boton-destino{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:none;
    border-radius:10px;
    background:linear-gradient(145deg,#ff2222,#7b0000);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.boton-destino:hover{
    filter:brightness(1.15);
}

/* ==================================================
   ESTADO VACÍO
================================================== */

.vacio{
    text-align:center;
    padding:40px 20px;
    color:#aaa;
    font-size:17px;
}

/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:600px){

    body{
        padding:12px;
    }

    .marca{
        font-size:25px;
    }

    .titulo{
        font-size:23px;
    }

    .panel{
        padding:12px;
    }

    th,
    td{
        font-size:13px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

    <div class="encabezado">

        <div class="logo">🐷</div>

        <div class="marca">
            ElDesierto
        </div>

        <div class="subtitulo">
            Sistema de control y gestión
        </div>

        <div class="titulo">
            🏭 Productos elaborados
        </div>

        <div class="descripcion">
            Existencias actuales de productos elaborados
        </div>

    </div>

    <a href="inventario.html" class="boton-volver">
        ⬅ Volver al inventario
    </a>

    <div class="panel">

        <table>

            <thead>

                <tr>

                    <th>Producto</th>

                    <th>Unidad</th>

                    <th>Cantidad</th>

                    <th>Consumo</th>

                    <th>Acción</th>

                </tr>

            </thead>

            <tbody id="tablaProductos">

                <tr>

                    <td colspan="5" class="vacio">
                        Cargando productos...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- ==================================================
     MENÚ DE CONSUMO
================================================== -->

<div id="menuConsumo" class="menu-consumo">

    <div class="panel" style="width:90%;max-width:420px;">

        <h2 class="titulo-destinos">
            Consumo del producto
        </h2>

        <button
            class="boton-opcion"
            onclick="prepararConsumo('todo')">
            Consumir todo
        </button>

        <button
            class="boton-opcion"
            onclick="prepararConsumo('cantidad')">
            Consumir cantidad específica
        </button>

        <button
            class="boton-opcion"
            onclick="cerrarMenuConsumo()">
            Cancelar
        </button>

    </div>

</div>


<!-- ==================================================
     MENÚ DE DESTINOS
================================================== -->

<div id="menuDestinos" class="menu-destinos">

    <div class="panel" style="width:90%;max-width:420px;">

        <div class="titulo-destinos">
            Seleccione destino
        </div>

        <button
            class="boton-destino"
            onclick="ejecutarConsumo('Destete')">
            🐷 Destete
        </button>

        <button
            class="boton-destino"
            onclick="ejecutarConsumo('Maternidad')">
            🐷 Maternidad
        </button>

        <button
            class="boton-destino"
            onclick="ejecutarConsumo('Cría')">
            🐷 Cría
        </button>

        <button
            class="boton-destino"
            onclick="ejecutarConsumo('Ceba')">
            🐷 Ceba
        </button>

        <button
            class="boton-destino"
            onclick="cancelarDestino()">
            Cancelar
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

let usuarioActual = "";
let productoSeleccionado = null;
let cantidadSeleccionada = 0;
let tipoConsumo = "";


/* ==================================================
   OBTENER USUARIO
================================================== */

async function obtenerUsuario(){

    const {
        data:{
            session
        }
    } = await clienteSupabase.auth.getSession();

    if(!session){

        window.location.href="login.html";
        return false;

    }

    usuarioActual =
        session.user.email || "";

    return true;

}


/* ==================================================
   CARGAR PRODUCTOS
================================================== */

async function cargarElaborados(){

    const tabla =
        document.getElementById("tablaProductos");

    const {
        data,
        error
    } = await clienteSupabase
        .from("productos_elaborados")
        .select("*")
        .order("Nombre",{ascending:true});


    if(error){

        console.error(error);

        tabla.innerHTML=`
            <tr>
                <td colspan="5" class="vacio">
                    Error al cargar los productos.
                </td>
            </tr>
        `;

        return;

    }


    if(!data || data.length===0){

        tabla.innerHTML=`
            <tr>
                <td colspan="5" class="vacio">
                    No existen productos elaborados.
                </td>
            </tr>
        `;

        return;

    }


    tabla.innerHTML="";


    data.forEach(producto=>{

        const fila =
            document.createElement("tr");


        fila.innerHTML=`

            <td>
                ${producto.Nombre || ""}
            </td>

            <td>
                ${producto.Unidad || ""}
            </td>

            <td>
                ${producto.Cantidad || 0}
            </td>

            <td>

                <button
                    class="boton-consumir"
                    onclick='mostrarMenuConsumo(${JSON.stringify(producto)})'>

                    Consumir

                </button>

            </td>

            <td>

                <button
                    class="boton-eliminar"
                    onclick='eliminarProductoElaborado(${producto.id})'>

                    Eliminar

                </button>

            </td>

        `;


        tabla.appendChild(fila);

    });

}


/* ==================================================
   MOSTRAR MENÚ DE CONSUMO
================================================== */

function mostrarMenuConsumo(producto){

    productoSeleccionado =
        producto;

    document
        .getElementById("menuConsumo")
        .classList
        .add("activo");

}


/* ==================================================
   CERRAR MENÚ
================================================== */

function cerrarMenuConsumo(){

    document
        .getElementById("menuConsumo")
        .classList
        .remove("activo");

}


/* ==================================================
   PREPARAR CONSUMO
================================================== */

async function prepararConsumo(tipo){

    tipoConsumo =
        tipo;

    cerrarMenuConsumo();


    if(tipo==="todo"){

        cantidadSeleccionada =
            Number(productoSeleccionado.Cantidad);

        document
            .getElementById("menuDestinos")
            .classList
            .add("activo");

        return;

    }


    if(tipo==="cantidad"){

        const cantidad =
            prompt(
                "Introduzca la cantidad a consumir:"
            );


        if(cantidad===null){
            return;
        }


        const valor =
            Number(cantidad);


        if(
            isNaN(valor) ||
            valor<=0 ||
            valor>Number(productoSeleccionado.Cantidad)
        ){

            alert(
                "Cantidad no válida."
            );

            return;

        }


        cantidadSeleccionada =
            valor;


        document
            .getElementById("menuDestinos")
            .classList
            .add("activo");

    }

}


/* ==================================================
   PREPARAR CANTIDAD
================================================== */

function prepararCantidad(){

    prepararConsumo("cantidad");

}


/* ==================================================
   CANCELAR DESTINO
================================================== */

function cancelarDestino(){

    document
        .getElementById("menuDestinos")
        .classList
        .remove("activo");

    productoSeleccionado=null;
    cantidadSeleccionada=0;

}


/* ==================================================
   EJECUTAR CONSUMO
================================================== */

async function ejecutarConsumo(destino){

    if(!productoSeleccionado){
        return;
    }


    const cantidad =
        Number(cantidadSeleccionada);


    if(
        !cantidad ||
        cantidad<=0
    ){

        alert(
            "Cantidad no válida."
        );

        return;

    }


    const nuevaCantidad =
        Number(productoSeleccionado.Cantidad)
        - cantidad;


    if(nuevaCantidad<0){

        alert(
            "La cantidad supera las existencias."
        );

        return;

    }


    /* ==================================================
       ACTUALIZAR PRODUCTO
    ================================================== */

    const {
        error:errorActualizacion
    } = await clienteSupabase

        .from("productos_elaborados")

        .update({
            Cantidad:nuevaCantidad
        })

        .eq(
            "id",
            productoSeleccionado.id
        );


    if(errorActualizacion){

        console.error(
            errorActualizacion
        );

        alert(
            "No se pudo actualizar el producto."
        );

        return;

    }


    /* ==================================================
       REGISTRAR DISTRIBUCIÓN
       AHORA TAMBIÉN GUARDA LA COMIDA
    ================================================== */

    const {
        error:errorMovimiento
    } = await clienteSupabase

        .from("movimientos_distribucion")

        .insert({

            distribucion:destino,

            comida:productoSeleccionado.Nombre,

            cantidad:cantidad,

            usuario:usuarioActual

        });


    if(errorMovimiento){

        console.error(
            errorMovimiento
        );

        alert(
            "El producto se actualizó, pero no se pudo registrar la distribución."
        );

        return;

    }


    document
        .getElementById("menuDestinos")
        .classList
        .remove("activo");


    productoSeleccionado=null;
    cantidadSeleccionada=0;


    await cargarElaborados();


    alert(
        "Consumo registrado correctamente."
    );

}


/* ==================================================
   ELIMINAR PRODUCTO
================================================== */

async function eliminarProductoElaborado(id){

    if(!confirm(
        "¿Está seguro de eliminar este producto elaborado?"
    )){

        return;

    }


    const {
        error
    } = await clienteSupabase

        .from("productos_elaborados")

        .delete()

        .eq("id",id);


    if(error){

        console.error(error);

        alert(
            "No se pudo eliminar el producto."
        );

        return;

    }


    await cargarElaborados();

}


/* ==================================================
   INICIAR
================================================== */

async function iniciar(){

    const usuario =
        await obtenerUsuario();


    if(!usuario){
        return;
    }


    await cargarElaborados();

}


iniciar();

</script>

</body>

</html>
