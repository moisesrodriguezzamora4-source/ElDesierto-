<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Productos elaborados - ElDesierto</title>

<style>

/* ================================
   CONFIGURACIÓN
================================ */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding:20px 15px;

    background:
    radial-gradient(
        circle at top,
        #3b0000 0%,
        #140000 35%,
        #000 75%
    );

    color:white;
}


/* ================================
   CONTENEDOR
================================ */

.contenedor{
    width:100%;
    max-width:1000px;
    margin:auto;
}


/* ================================
   ENCABEZADO
================================ */

.encabezado{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    font-size:48px;

    filter:
    drop-shadow(0 0 8px red)
    drop-shadow(0 0 15px #8b0000);

    margin-bottom:5px;
}

.marca{
    font-size:28px;
    font-weight:bold;

    color:#ff2020;

    text-shadow:
    0 0 8px #ff0000,
    0 0 18px #8b0000;
}

.subtitulo{
    color:#999;
    font-size:14px;
    margin-top:5px;
}

.titulo{
    margin-top:22px;

    font-size:26px;
    font-weight:bold;
}

.descripcion{
    color:#aaa;
    margin-top:7px;
    font-size:14px;
}


/* ================================
   BOTÓN VOLVER
================================ */

.boton-volver{

    display:inline-block;

    margin-bottom:20px;

    padding:13px 22px;

    color:white;

    background:
    linear-gradient(
        145deg,
        #ff3030,
        #a40000
    );

    border:none;

    border-radius:12px;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 5px 0 #650000,
    0 8px 15px rgba(255,0,0,.35);

    transition:.15s;
}

.boton-volver:active{

    transform:translateY(4px);

    box-shadow:
    0 1px 0 #650000,
    0 3px 8px rgba(255,0,0,.3);
}


/* ================================
   PANEL
================================ */

.panel{

    background:
    linear-gradient(
        145deg,
        rgba(35,35,35,.96),
        rgba(8,8,8,.98)
    );

    border:1px solid #450000;

    border-radius:18px;

    padding:15px;

    box-shadow:

    inset 0 1px 0
    rgba(255,255,255,.08),

    0 12px 30px
    rgba(0,0,0,.7),

    0 0 18px
    rgba(180,0,0,.12);

    overflow-x:auto;
}


/* ================================
   TABLA
================================ */

table{

    width:100%;

    min-width:800px;

    border-collapse:separate;

    border-spacing:0;

    overflow:hidden;
}


/* ENCABEZADOS */

th{

    background:
    linear-gradient(
        145deg,
        #e00000,
        #850000
    );

    color:white;

    padding:15px 10px;

    font-size:14px;

    border-bottom:2px solid #ff3333;
}

th:first-child{
    border-radius:10px 0 0 0;
}

th:last-child{
    border-radius:0 10px 0 0;
}


/* CELDAS */

td{

    padding:14px 10px;

    text-align:center;

    color:#eee;

    background:#111;

    border-bottom:1px solid #292929;
}


/* FILAS ALTERNAS */

tr:nth-child(even) td{
    background:#181818;
}


/* EFECTO AL TOCAR/PASAR */

tr:hover td{
    background:#260000;
}


/* CANTIDAD */

td:nth-child(3){

    color:#ff3030;

    font-weight:bold;

    font-size:16px;
}


/* ================================
   BOTÓN CONSUMIR
================================ */

.boton-consumir{

    padding:9px 12px;

    border:none;

    border-radius:9px;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        145deg,
        #ff3030,
        #8b0000
    );

    box-shadow:
    0 4px 0 #500000,
    0 6px 12px rgba(255,0,0,.25);

    transition:.15s;
}

.boton-consumir:active{

    transform:translateY(3px);

    box-shadow:
    0 1px 0 #500000;

}


/* ================================
   BOTÓN ELIMINAR
================================ */

.boton-eliminar{

    padding:9px 12px;

    border:none;

    border-radius:9px;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        145deg,
        #ff3030,
        #8b0000
    );

    box-shadow:
    0 4px 0 #500000,
    0 6px 12px rgba(255,0,0,.25);

    transition:.15s;
}

.boton-eliminar:active{

    transform:translateY(3px);

    box-shadow:
    0 1px 0 #500000;

}


/* ================================
   MENÚ DE CONSUMO
================================ */

.menu-consumo{

    margin-top:10px;

    padding:12px;

    border-radius:12px;

    background:
    linear-gradient(
        145deg,
        #252525,
        #0a0a0a
    );

    border:1px solid #600000;

    box-shadow:
    inset 0 0 10px #000;

}


/* ================================
   BOTONES DEL MENÚ
================================ */

.boton-opcion{

    display:block;

    width:100%;

    margin:7px 0;

    padding:11px;

    border:none;

    border-radius:9px;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        145deg,
        #d90000,
        #760000
    );

    box-shadow:
    0 4px 0 #450000;

}


.boton-opcion:active{

    transform:translateY(3px);

    box-shadow:
    0 1px 0 #450000;

}


/* ================================
   MENÚ DESTINOS
================================ */

.menu-destinos{

    margin-top:10px;

    padding:12px;

    border-radius:12px;

    background:
    linear-gradient(
        145deg,
        #1f1f1f,
        #070707
    );

    border:1px solid #ff2020;

    box-shadow:
    inset 0 0 10px #000,
    0 0 12px rgba(255,0,0,.15);

}

.titulo-destinos{

    text-align:center;

    color:#ff3030;

    font-size:14px;

    font-weight:bold;

    margin-bottom:8px;

}


/* ================================
   BOTONES DESTINO
================================ */

.boton-destino{

    display:block;

    width:100%;

    margin:7px 0;

    padding:11px;

    border:none;

    border-radius:9px;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        145deg,
        #9d0000,
        #4d0000
    );

    box-shadow:
    0 4px 0 #300000;

}

.boton-destino:active{

    transform:translateY(3px);

    box-shadow:
    0 1px 0 #300000;

}


/* ================================
   TABLA VACÍA
================================ */

.vacio{

    text-align:center;

    padding:25px;

    color:#888;
}


/* ================================
   MÓVIL
================================ */

@media(max-width:600px){

    body{
        padding:15px 10px;
    }

    .logo{
        font-size:42px;
    }

    .marca{
        font-size:24px;
    }

    .titulo{
        font-size:22px;
    }

    .panel{
        padding:10px;
    }

    th,
    td{
        padding:12px 8px;
        font-size:14px;
    }

    .boton-consumir,
    .boton-eliminar{
        font-size:13px;
        padding:8px 10px;
    }

}

</style>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<div class="contenedor">


    <!-- =========================
         ENCABEZADO
    ========================== -->

    <div class="encabezado">

        <div class="logo">
            🐷
        </div>

        <div class="marca">
            ElDesierto
        </div>

        <div class="subtitulo">
            Sistema de control y gestión
        </div>

        <div class="titulo">
            🏭 Productos elaborados
        </div>

        <div class="descripcion">
            Existencias actuales de productos elaborados
        </div>

    </div>


    <!-- =========================
         VOLVER
    ========================== -->

    <button
        class="boton-volver"
        onclick="window.location.href='inventario.html'">

        ⬅ Volver al inventario

    </button>


    <!-- =========================
         TABLA
    ========================== -->

    <div class="panel">

        <table>

            <thead>

                <tr>

                    <th>
                        Producto
                    </th>

                    <th>
                        Unidad
                    </th>

                    <th>
                        Cantidad
                    </th>

                    <th>
                        Consumo
                    </th>

                    <th>
                        Acción
                    </th>

                </tr>

            </thead>


            <tbody id="tablaElaborados">

            </tbody>

        </table>

    </div>


</div>


<!-- SUPABASE -->

<script src="supabase.js"></script>


<script>

/* ==========================================
   VARIABLE DE SESIÓN
========================================== */

let usuarioActual = "";


/* ==========================================
   OBTENER USUARIO
========================================== */

async function obtenerUsuario(){

    const {
        data,
        error
    } =
        await clienteSupabase.auth.getSession();


    if(error){

        console.error(
            "Error obteniendo sesión:",
            error
        );

        return;

    }


    if(!data.session){

        window.location.href="login.html";

        return;

    }


    usuarioActual =
        data.session.user.email
        ||
        data.session.user.id
        ||
        "Usuario";

}


/* ==========================================
   CARGAR PRODUCTOS
========================================== */

async function cargarElaborados(){

    const {
        data,
        error
    } =
        await clienteSupabase

        .from("productos_elaborados")

        .select(
            "id, Nombre, Unidad, Cantidad"
        );


    if(error){

        alert(
            "Error cargando productos elaborados: "
            +
            error.message
        );

        return;

    }


    const tabla =
        document.getElementById(
            "tablaElaborados"
        );


    tabla.innerHTML="";


    if(!data || data.length===0){

        tabla.innerHTML=`

            <tr>

                <td
                    colspan="5"
                    class="vacio">

                    No hay productos elaborados registrados.

                </td>

            </tr>

        `;

        return;

    }


    data.forEach(producto=>{

        tabla.innerHTML+=`

            <tr>

                <td>
                    ${producto.Nombre || ""}
                </td>

                <td>
                    ${producto.Unidad || ""}
                </td>

                <td>
                    ${producto.Cantidad ?? 0}
                </td>

                <td>

                    <button
                        class="boton-consumir"
                        onclick="mostrarMenuConsumo(${producto.id})">

                        🍽️ Consumir

                    </button>

                    <div
                        id="menu-${producto.id}"
                        class="menu-consumo"
                        style="display:none;">

                        <button
                            class="boton-opcion"
                            onclick="prepararConsumo(${producto.id}, '${String(producto.Nombre || "").replace(/'/g,"\\\\'")}', ${Number(producto.Cantidad)})">

                            🍽️ Consumir todo

                        </button>

                        <button
                            class="boton-opcion"
                            onclick="prepararCantidad(${producto.id}, '${String(producto.Nombre || "").replace(/'/g,"\\\\'")}', ${Number(producto.Cantidad)})">

                            ⚖️ Consumir cantidad específica

                        </button>

                        <button
                            class="boton-opcion"
                            onclick="cerrarMenuConsumo(${producto.id})">

                            ❌ Cancelar

                        </button>

                    </div>

                    <div
                        id="destinos-${producto.id}"
                        class="menu-destinos"
                        style="display:none;">

                        <div class="titulo-destinos">
                            Selecciona el destino
                        </div>

                        <button
                            class="boton-destino"
                            onclick="ejecutarConsumo(${producto.id}, 'Destete')">

                            🍼 Destete

                        </button>

                        <button
                            class="boton-destino"
                            onclick="ejecutarConsumo(${producto.id}, 'Maternidad')">

                            🏠 Maternidad

                        </button>

                        <button
                            class="boton-destino"
                            onclick="ejecutarConsumo(${producto.id}, 'Cría')">

                            🐷 Cría

                        </button>

                        <button
                            class="boton-destino"
                            onclick="ejecutarConsumo(${producto.id}, 'Ceba')">

                            🐖 Ceba

                        </button>

                        <button
                            class="boton-opcion"
                            onclick="cancelarDestino(${producto.id})">

                            ❌ Cancelar

                        </button>

                    </div>

                </td>

                <td>

                    <button
                        class="boton-eliminar"
                        onclick="eliminarProductoElaborado(${producto.id}, '${String(producto.Nombre || "").replace(/'/g,"\\\\'")}')">

                        🗑️ Eliminar

                    </button>

                </td>

            </tr>

        `;

    });

}


/* ==========================================
   MOSTRAR MENÚ
========================================== */

function mostrarMenuConsumo(id){

    const menu =
        document.getElementById(
            "menu-"+id
        );

    const destinos =
        document.getElementById(
            "destinos-"+id
        );


    if(menu){

        menu.style.display="block";

    }

    if(destinos){

        destinos.style.display="none";

    }

}


/* ==========================================
   CERRAR MENÚ
========================================== */

function cerrarMenuConsumo(id){

    const menu =
        document.getElementById(
            "menu-"+id
        );

    const destinos =
        document.getElementById(
            "destinos-"+id
        );


    if(menu){

        menu.style.display="none";

    }

    if(destinos){

        destinos.style.display="none";

    }

}


/* ==========================================
   PREPARAR CONSUMO TOTAL
========================================== */

function prepararConsumo(
    id,
    nombre,
    cantidadDisponible
){

    if(cantidadDisponible<=0){

        alert(
            "⚠️ Este producto no tiene cantidad disponible."
        );

        return;

    }


    const menu =
        document.getElementById(
            "menu-"+id
        );

    const destinos =
        document.getElementById(
            "destinos-"+id
        );


    if(menu){

        menu.style.display="none";

    }

    if(destinos){

        destinos.dataset.cantidad =
            String(cantidadDisponible);

        destinos.dataset.tipo =
            "todo";

        destinos.dataset.nombre =
            nombre;

        destinos.style.display="block";

    }

}


/* ==========================================
   PREPARAR CANTIDAD ESPECÍFICA
========================================== */

function prepararCantidad(
    id,
    nombre,
    cantidadDisponible
){

    if(cantidadDisponible<=0){

        alert(
            "⚠️ Este producto no tiene cantidad disponible."
        );

        return;

    }


    const cantidad =
        prompt(
            "¿Cuántos kg de "
            +
            nombre
            +
            " deseas consumir?\n\n"
            +
            "Disponible: "
            +
            cantidadDisponible
            +
            " kg"
        );


    if(cantidad===null){

        return;

    }


    const cantidadConsumir =
        Number(cantidad);


    if(
        !Number.isFinite(cantidadConsumir)
        ||
        cantidadConsumir<=0
    ){

        alert(
            "⚠️ Introduce una cantidad válida."
        );

        return;

    }


    if(cantidadConsumir>cantidadDisponible){

        alert(
            "❌ No puedes consumir "
            +
            cantidadConsumir
            +
            " kg.\n\n"
            +
            "Solo hay "
            +
            cantidadDisponible
            +
            " kg disponibles."
        );

        return;

    }


    const menu =
        document.getElementById(
            "menu-"+id
        );

    const destinos =
        document.getElementById(
            "destinos-"+id
        );


    if(menu){

        menu.style.display="none";

    }

    if(destinos){

        destinos.dataset.cantidad =
            String(cantidadConsumir);

        destinos.dataset.tipo =
            "cantidad";

        destinos.dataset.nombre =
            nombre;

        destinos.style.display="block";

    }

}


/* ==========================================
   CANCELAR DESTINO
========================================== */

function cancelarDestino(id){

    const destinos =
        document.getElementById(
            "destinos-"+id
        );

    if(destinos){

        destinos.style.display="none";

        delete destinos.dataset.cantidad;
        delete destinos.dataset.tipo;
        delete destinos.dataset.nombre;

    }

}


/* ==========================================
   EJECUTAR CONSUMO
========================================== */

async function ejecutarConsumo(
    id,
    destino
){

    const destinos =
        document.getElementById(
            "destinos-"+id
        );


    if(!destinos){

        return;

    }


    const cantidad =
        Number(
            destinos.dataset.cantidad
        );


    const nombre =
        destinos.dataset.nombre
        ||
        "Producto elaborado";


    if(
        !Number.isFinite(cantidad)
        ||
        cantidad<=0
    ){

        alert(
            "❌ No se encontró una cantidad válida para consumir."
        );

        return;

    }


    const confirmar =
        confirm(
            "¿Confirmas la distribución?\n\n"
            +
            "Producto: "
            +
            nombre
            +
            "\nCantidad: "
            +
            cantidad
            +
            " kg"
            +
            "\nDestino: "
            +
            destino
        );


    if(!confirmar){

        return;

    }


    /* ======================================
       OBTENER CANTIDAD ACTUAL
    ====================================== */

    const {
        data:producto,
        error:errorProducto
    } =
        await clienteSupabase

        .from("productos_elaborados")

        .select(
            "id, Nombre, Cantidad"
        )

        .eq(
            "id",
            id
        )

        .maybeSingle();


    if(errorProducto){

        alert(
            "❌ Error consultando el producto:\n\n"
            +
            errorProducto.message
        );

        return;

    }


    if(!producto){

        alert(
            "❌ El producto ya no existe."
        );

        await cargarElaborados();

        return;

    }


    const cantidadDisponible =
        Number(producto.Cantidad || 0);


    if(cantidad>cantidadDisponible){

        alert(
            "❌ La cantidad disponible cambió.\n\n"
            +
            "Disponible actualmente: "
            +
            cantidadDisponible
            +
            " kg"
        );

        await cargarElaborados();

        return;

    }


    const nuevaCantidad =
        cantidadDisponible-cantidad;


    /* ======================================
       ACTUALIZAR INVENTARIO
    ====================================== */

    const {
        error:errorActualizacion
    } =
        await clienteSupabase

        .from("productos_elaborados")

        .update({

            Cantidad:nuevaCantidad

        })

        .eq(
            "id",
            id
        );


    if(errorActualizacion){

        alert(
            "❌ Error actualizando el producto:\n\n"
            +
            errorActualizacion.message
        );

        return;

    }


    /* ======================================
       REGISTRAR DISTRIBUCIÓN
    ====================================== */

    const {
        error:errorRegistro
    } =
        await clienteSupabase

        .from("movimientos_distribucion")

        .insert({

            distribucion:destino,

            cantidad:cantidad,

            usuario:usuarioActual

        });


    if(errorRegistro){

        /*
         * Si no se pudo registrar el historial,
         * intentamos revertir el descuento para
         * no dejar el inventario incorrecto.
         */

        await clienteSupabase

        .from("productos_elaborados")

        .update({

            Cantidad:cantidadDisponible

        })

        .eq(
            "id",
            id
        );


        alert(
            "❌ No se pudo registrar la distribución.\n\n"
            +
            errorRegistro.message
        );

        return;

    }


    alert(
        "✅ Distribución realizada correctamente.\n\n"
        +
        "Producto: "
        +
        producto.Nombre
        +
        "\nCantidad: "
        +
        cantidad
        +
        " kg"
        +
        "\nDestino: "
        +
        destino
        +
        "\nDisponible: "
        +
        nuevaCantidad
        +
        " kg"
    );


    cancelarDestino(id);

    await cargarElaborados();

}


/* ==========================================
   ELIMINAR PRODUCTO ELABORADO
========================================== */

async function eliminarProductoElaborado(
    id,
    nombre
){

    const confirmar =
        confirm(
            "⚠️ ¿Estás seguro de que deseas eliminar este producto elaborado?\n\n"
            +
            "Producto: "
            +
            nombre
            +
            "\n\n"
            +
            "Esto eliminará el registro de Productos elaborados."
        );


    if(!confirmar){

        return;

    }


    const {
        error
    } =
        await clienteSupabase

        .from("productos_elaborados")

        .delete()

        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "❌ Error eliminando el producto elaborado:\n\n"
            +
            error.message
        );

        return;

    }


    alert(
        "✅ Producto elaborado eliminado correctamente."
    );


    await cargarElaborados();

}


/* ==========================================
   INICIAR
========================================== */

async function iniciar(){

    await obtenerUsuario();

    await cargarElaborados();

}


iniciar();

</script>


</body>

</html>
