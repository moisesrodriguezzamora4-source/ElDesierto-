<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Productos Elaborados - ElDesierto</title>

<style>

/* ==================================================
   CONFIGURACIÓN GENERAL
================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:white;

    background:
        radial-gradient(circle at top,#1d1d1d,#050505 65%);
}


/* ==================================================
   TITULO
================================================== */

h1{
    text-align:center;
    margin:25px 0;
    color:#ff3030;
    font-size:32px;
    text-shadow:
        0 0 10px rgba(255,0,0,.5),
        0 4px 8px #000;
}


/* ==================================================
   BOTON REGRESAR
================================================== */

.botonRegresar{
    display:block;
    width:220px;
    margin:0 auto 25px;

    padding:14px;

    text-align:center;

    color:white;
    text-decoration:none;
    font-weight:bold;
    font-size:16px;

    border-radius:12px;

    background:linear-gradient(
        145deg,
        #ff3030,
        #a80000
    );

    box-shadow:
        0 5px 0 #650000,
        0 10px 20px rgba(0,0,0,.7);

    transition:.2s;
}

.botonRegresar:hover{
    transform:translateY(-2px);
}


/* ==================================================
   CONTENEDOR
================================================== */

.contenedor{
    width:95%;
    max-width:1100px;
    margin:auto;
}


/* ==================================================
   TABLA
================================================== */

.tablaContenedor{
    width:100%;
    overflow-x:auto;

    background:
        linear-gradient(
            145deg,
            rgba(30,30,30,.95),
            rgba(5,5,5,.98)
        );

    border-radius:16px;

    padding:15px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.8),
        inset 0 1px 1px rgba(255,255,255,.05);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    background:#9d0000;
    color:white;

    padding:14px 10px;

    text-align:center;

    font-size:15px;
}

td{
    padding:12px 10px;

    text-align:center;

    border-bottom:1px solid #333;

    color:#eee;
}

tr:hover{
    background:rgba(255,48,48,.08);
}


/* ==================================================
   BOTONES
================================================== */

button{
    border:none;
    cursor:pointer;

    color:white;
    font-weight:bold;

    border-radius:10px;

    padding:10px 14px;

    background:linear-gradient(
        145deg,
        #ff3030,
        #a80000
    );

    box-shadow:
        0 4px 0 #650000,
        0 7px 15px rgba(0,0,0,.6);

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:translateY(2px);

    box-shadow:
        0 2px 0 #650000;
}


/* ==================================================
   CONSUMO
================================================== */

.consumo{
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:center;
}

.consumo input{
    width:100px;

    padding:8px;

    border-radius:8px;

    border:1px solid #555;

    background:#111;

    color:white;

    text-align:center;
}

.consumo select{
    padding:8px;

    border-radius:8px;

    border:1px solid #555;

    background:#111;

    color:white;
}


/* ==================================================
   MENSAJES
================================================== */

.mensaje{
    text-align:center;

    padding:25px;

    color:#aaa;

    font-size:17px;
}

.error{
    color:#ff5555;
}


/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:700px){

    h1{
        font-size:26px;
    }

    .contenedor{
        width:98%;
    }

    .tablaContenedor{
        padding:8px;
    }

}

</style>

</head>


<body>


<h1>🐷 Productos Elaborados</h1>


<a href="inventario.html" class="botonRegresar">
    ⬅️ Volver al Inventario
</a>


<div class="contenedor">

    <div class="tablaContenedor">

        <table>

            <thead>

                <tr>

                    <th>Producto</th>

                    <th>Unidad</th>

                    <th>Cantidad</th>

                    <th>Consumo</th>

                    <th>Acción</th>

                </tr>

            </thead>

            <tbody id="tablaProductos">

                <tr>

                    <td colspan="5" class="mensaje">
                        Cargando productos...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

/* ==================================================
   VARIABLES
================================================== */

let usuarioActual = "";



/* ==================================================
   VERIFICAR SESIÓN
================================================== */

async function verificarSesion(){

    const {
        data:{
            session
        }
    } = await clienteSupabase.auth.getSession();


    if(!session){

        window.location.href="login.html";

        return false;
    }


    usuarioActual =
        session.user.email ||
        session.user.id ||
        "";


    return true;
}



/* ==================================================
   CARGAR PRODUCTOS
================================================== */

async function cargarProductos(){

    const tabla =
        document.getElementById("tablaProductos");


    tabla.innerHTML = `
        <tr>
            <td colspan="5" class="mensaje">
                Cargando productos...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } = await clienteSupabase

        .from("productos_elaborados")

        .select("*")

        .order("id",{ascending:true});


    if(error){

        console.error(error);

        tabla.innerHTML = `
            <tr>
                <td colspan="5" class="mensaje error">
                    Error al cargar los productos elaborados.
                </td>
            </tr>
        `;

        return;
    }


    if(!data || data.length === 0){

        tabla.innerHTML = `
            <tr>
                <td colspan="5" class="mensaje">
                    No hay productos elaborados registrados.
                </td>
            </tr>
        `;

        return;
    }


    tabla.innerHTML = "";


    data.forEach(producto => {

        const fila =
            document.createElement("tr");


        fila.innerHTML = `

            <td>
                ${producto.Nombre || ""}
            </td>

            <td>
                ${producto.Unidad || ""}
            </td>

            <td>
                ${producto.Cantidad ?? 0}
            </td>

            <td>

                <div class="consumo">

                    <input
                        type="number"
                        min="0"
                        step="0.01"
                        id="cantidad_${producto.id}"
                        placeholder="Cantidad"
                    >

                    <select id="destino_${producto.id}">

                        <option value="">
                            Seleccionar destino
                        </option>

                        <option value="Destete">
                            Destete
                        </option>

                        <option value="Maternidad">
                            Maternidad
                        </option>

                        <option value="Cría">
                            Cría
                        </option>

                        <option value="Ceba">
                            Ceba
                        </option>

                    </select>

                    <button
                        onclick="consumirProducto(${producto.id})"
                    >
                        Consumir
                    </button>

                </div>

            </td>

            <td>

                <button
                    onclick="eliminarProducto(${producto.id})"
                >
                    🗑️ Eliminar
                </button>

            </td>

        `;


        tabla.appendChild(fila);

    });

}



/* ==================================================
   CONSUMIR PRODUCTO
================================================== */

async function consumirProducto(id){

    const input =
        document.getElementById(
            `cantidad_${id}`
        );


    const select =
        document.getElementById(
            `destino_${id}`
        );


    const cantidad =
        parseFloat(input.value);


    const destino =
        select.value;


    if(!cantidad || cantidad <= 0){

        alert(
            "Introduzca una cantidad válida."
        );

        return;
    }


    if(!destino){

        alert(
            "Seleccione un destino."
        );

        return;
    }



    /* ==============================================
       OBTENER PRODUCTO
    ============================================== */

    const {
        data:producto,
        error:errorProducto
    } = await clienteSupabase

        .from("productos_elaborados")

        .select("*")

        .eq("id",id)

        .single();


    if(errorProducto || !producto){

        console.error(errorProducto);

        alert(
            "No se pudo obtener el producto."
        );

        return;
    }



    /* ==============================================
       COMPROBAR EXISTENCIA
    ============================================== */

    const cantidadDisponible =
        Number(producto.Cantidad || 0);


    if(cantidad > cantidadDisponible){

        alert(
            "La cantidad a consumir es mayor que la cantidad disponible."
        );

        return;
    }



    /* ==============================================
       NUEVA CANTIDAD
    ============================================== */

    const nuevaCantidad =
        cantidadDisponible - cantidad;



    /* ==============================================
       ACTUALIZAR PRODUCTO
    ============================================== */

    const {
        error:errorUpdate
    } = await clienteSupabase

        .from("productos_elaborados")

        .update({
            Cantidad:nuevaCantidad
        })

        .eq("id",id);


    if(errorUpdate){

        console.error(errorUpdate);

        alert(
            "Error al actualizar el producto."
        );

        return;
    }



    /* ==============================================
       REGISTRAR DISTRIBUCIÓN
       
       MODIFICACIÓN:
       Se guarda también el nombre del producto
       en la columna "comida".
    ============================================== */

    const {
        error:errorMovimiento
    } = await clienteSupabase

        .from("movimientos_distribucion")

        .insert({

            distribucion:destino,

            comida:producto.Nombre,

            cantidad:cantidad,

            usuario:usuarioActual

        });


    if(errorMovimiento){

        console.error(errorMovimiento);

        alert(
            "El producto se actualizó, pero ocurrió un error al registrar la distribución."
        );

        cargarProductos();

        return;
    }



    alert(
        "Distribución registrada correctamente."
    );


    cargarProductos();

}



/* ==================================================
   ELIMINAR PRODUCTO
================================================== */

async function eliminarProducto(id){

    const confirmar =
        confirm(
            "¿Está seguro de eliminar este producto elaborado?"
        );


    if(!confirmar){

        return;
    }



    const {
        error
    } = await clienteSupabase

        .from("productos_elaborados")

        .delete()

        .eq("id",id);


    if(error){

        console.error(error);

        alert(
            "Error al eliminar el producto."
        );

        return;
    }


    alert(
        "Producto eliminado correctamente."
    );


    cargarProductos();

}



/* ==================================================
   INICIAR
================================================== */

async function iniciar(){

    const sesion =
        await verificarSesion();


    if(!sesion){

        return;
    }


    cargarProductos();

}


iniciar();

</script>


</body>

</html>
