</div>



<!-- SELECCIÓN -->

<div class="tarjeta">

<select
id="recetaSelect"
onchange="calcularReceta()">

<option value="">

id="panelDistribucion"

id="infoDistribucion"

<strong>Distribuido:</strong>

<span id="totalDistribuido">0</span>

<strong>Restante:</strong>

<span id="restanteDistribucion">0</span>

kg

🏭 FABRICAR AHORA

<script src="supabase.js"></script>


<script>


/* =====================================================
   VARIABLES
===================================================== */

let recetaSeleccionada = null;

let distribucionActual = [];


/* =====================================================
   NORMALIZAR NOMBRES
===================================================== */

function normalizar(nombre){

    let texto = String(nombre || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/\s+/g," ");

    const equivalencias = {

        "soya":"soja",

        "soy":"soja",

        "maiz":"maiz",

        "chicharo":"chicharo",

        "pre mezcla":"premezcla"

    };


    return equivalencias[texto] || texto;

}


/* =====================================================
   CARGAR RECETAS
===================================================== */

async function cargarRecetas(){

    const {data,error} =
    await clienteSupabase

    .from("recetas")

    .select(
        "id,nombre,distribucion_destinos"
    )

    .order("nombre");


    if(error){

        alert(
            "Error cargando recetas:\n\n" +
            error.message
        );

        return;

    }


    let html =
    '<option value="">Seleccione una receta</option>';


    data.forEach(r=>{

        html +=
        `<option value="${r.id}">
        ${r.nombre}
        </option>`;

    });


    document
    .getElementById("recetaSelect")
    .innerHTML = html;

}


/* =====================================================
   OBTENER DESTINOS
===================================================== */

function obtenerDestinos(receta){

    if(
        receta &&
        Array.isArray(receta.distribucion_destinos)
    ){

        return receta.distribucion_destinos;

    }

    return [];

}


/* =====================================================
   CANTIDAD DISTRIBUIBLE
===================================================== */

function calcularCantidadDistribuible(cantidad){

    /*
       Por cada 1015 kg físicos:

       1000 kg = alimento distribuible
       10 kg   = calcio
       5 kg    = sal

       Por tanto:
       distribuible = cantidad * 1000 / 1015
    */

    return cantidad * (1000 / 1015);

}


/* =====================================================
   CALCULAR CANTIDAD DE CALCIO
===================================================== */

function calcularCalcio(cantidad){

    return cantidad * (10 / 1015);

}


/* =====================================================
   CALCULAR CANTIDAD DE SAL
===================================================== */

function calcularSal(cantidad){

    return cantidad * (5 / 1015);

}


/* =====================================================
   CALCULAR RECETA
===================================================== */

async function calcularReceta(){

    const recetaId =
    document
    .getElementById("recetaSelect")
    .value;


    const cantidadFabricar =
    Number(
        document
        .getElementById("cantidadFabricar")
        .value
    );


    if(
        !recetaId ||
        !cantidadFabricar ||
        cantidadFabricar <= 0
    ){

        recetaSeleccionada = null;

        document
        .getElementById("resumen")
        .innerHTML = `

        <div class="estado">

        Seleccione una receta y una cantidad válida.

        </div>

        `;

        document
        .getElementById("panelDistribucion")
        .style.display="none";

        return;

    }



    /* OBTENER RECETA */

    const {data:receta,error:errorReceta} =

    await clienteSupabase

    .from("recetas")

    .select("*")

    .eq("id",recetaId)

    .single();


    if(errorReceta){

        document
        .getElementById("resumen")
        .innerHTML =

        `<div class="estado">

        ❌ ${errorReceta.message}

        </div>`;

        return;

    }


    recetaSeleccionada = receta;



    /* OBTENER MATERIAS */

    const {data:detalle,error:errorDetalle} =

    await clienteSupabase

    .from("detalle_recetas")

    .select("*")

    .eq("receta_id",recetaId);


    if(errorDetalle){

        document
        .getElementById("resumen")
        .innerHTML =

        `<div class="estado">

        ❌ ${errorDetalle.message}

        </div>`;

        return;

    }


    if(!detalle || detalle.length === 0){

        document
        .getElementById("resumen")
        .innerHTML =

        `<div class="estado">

        ⚠️ Esta receta no tiene materias primas.

        </div>`;

        return;

    }



    let html = "";


    detalle.forEach(m=>{


        const necesario =

        (
            cantidadFabricar /
            Number(receta.cantidad_resultado)
        )

        *

        Number(m.cantidad);


        html += `

        <div class="materia-resumen">

        <div class="nombre-materia">

        🌽 ${m.materia_prima}

        </div>


        <div class="cantidad-materia">

        ${necesario.toFixed(2)} kg

        </div>

        </div>

        `;

    });


    /*
       MOSTRAR CALCIO Y SAL COMO PARTE
       DE LA FABRICACIÓN GENERAL
    */

    const calcio = calcularCalcio(cantidadFabricar);

    const sal = calcularSal(cantidadFabricar);


    html += `

    <div class="materia-resumen">

        <div class="nombre-materia">

        🦴 Calcio

        </div>

        <div class="cantidad-materia">

        ${calcio.toFixed(2)} kg

        </div>

    </div>


    <div class="materia-resumen">

        <div class="nombre-materia">

        🧂 Sal

        </div>

        <div class="cantidad-materia">

        ${sal.toFixed(2)} kg

        </div>

    </div>

    `;


    document
    .getElementById("resumen")
    .innerHTML = html;


    mostrarDistribucion(
        receta,
        cantidadFabricar
    );

}


/* =====================================================
   MOSTRAR DISTRIBUCIÓN
===================================================== */

function mostrarDistribucion(receta,cantidadFabricar){

    const destinos =
    obtenerDestinos(receta);


    const panel =
    document.getElementById(
        "panelDistribucion"
    );


    const lista =
    document.getElementById(
        "listaDistribucion"
    );


    distribucionActual = [];


    if(!destinos || destinos.length === 0){

        panel.style.display="none";

        return;

    }


    panel.style.display="block";


    const distribuible =
    calcularCantidadDistribuible(
        cantidadFabricar
    );


    document
    .getElementById("infoDistribucion")
    .innerHTML =

    "⚖️ Cantidad para distribuir: <strong>" +

    distribuible.toFixed(2) +

    " kg</strong>";


    let html="";


    destinos.forEach((destino,index)=>{

        distribucionActual.push({

            destino:destino,

            cantidad:0

        });


        html += `

        <div class="destino-distribucion">

            <div class="destino-titulo">

            📍 ${destino}

            </div>

            <div class="destino-fila">

                <input

                type="number"

                min="0"

                step="any"

                id="cantidadDestino${index}"

                placeholder="Cantidad para ${destino}"

                oninput="actualizarDistribucion()">

                <button

                type="button"

                class="boton boton-todo"

                onclick="ponerTodo(${index})">

                Todo

                </button>

            </div>

        </div>

        `;

    });


    lista.innerHTML=html;


    actualizarDistribucion();

}


/* =====================================================
   PONER TODO PARA UN DESTINO
===================================================== */

function ponerTodo(index){

    if(!recetaSeleccionada){

        return;

    }


    const cantidadFabricar =

    Number(
        document
        .getElementById(
            "cantidadFabricar"
        )
        .value
    );


    const distribuible =

    calcularCantidadDistribuible(
        cantidadFabricar
    );


    distribucionActual.forEach(
        (item,i)=>{

            const input =
            document.getElementById(
                "cantidadDestino"+i
            );

            if(!input)return;


            if(i === index){

                input.value =
                distribuible.toFixed(2);

            }else{

                input.value="0";

            }

        }
    );


    actualizarDistribucion();

}


/* =====================================================
   ACTUALIZAR DISTRIBUCIÓN
===================================================== */

function actualizarDistribucion(){

    if(!recetaSeleccionada){

        return;

    }


    const cantidadFabricar =

    Number(
        document
        .getElementById(
            "cantidadFabricar"
        )
        .value
    );


    const distribuible =

    calcularCantidadDistribuible(
        cantidadFabricar
    );


    let total=0;


    distribucionActual.forEach(
        (item,index)=>{

            const input =
            document.getElementById(
                "cantidadDestino"+index
            );


            if(!input)return;


            const cantidad =
            Number(input.value) || 0;


            item.cantidad =
            cantidad;


            total += cantidad;

        }
    );


    const restante =
    distribuible-total;


    document
    .getElementById("totalDistribuido")
    .textContent =
    total.toFixed(2);


    document
    .getElementById("restanteDistribucion")
    .textContent =
    restante.toFixed(2);


    if(restante < 0){

        document
        .getElementById("restanteDistribucion")
        .style.color="#ff3333";

    }else{

        document
        .getElementById("restanteDistribucion")
        .style.color="#aaa";

    }

}


/* =====================================================
   VALIDAR DISTRIBUCIÓN
===================================================== */

function validarDistribucion(){

    if(
        !recetaSeleccionada
    ){

        return {

            correcta:true,

            distribucion:[]

        };

    }


    const destinos =
    obtenerDestinos(
        recetaSeleccionada
    );


    if(
        !destinos ||
        destinos.length === 0
    ){

        return {

            correcta:true,

            distribucion:[]

        };

    }


    const cantidadFabricar =

    Number(
        document
        .getElementById(
            "cantidadFabricar"
        )
        .value
    );


    const distribuible =

    calcularCantidadDistribuible(
        cantidadFabricar
    );


    let total=0;

    let distribucion=[];


    distribucionActual.forEach(
        item=>{

            const cantidad =
            Number(item.cantidad) || 0;


            total += cantidad;


            if(cantidad > 0){

                distribucion.push({

                    destino:item.destino,

                    cantidad:cantidad

                });

            }

        }
    );


    const diferencia =
    distribuible-total;


    /*
       Se permite una diferencia mínima
       por decimales de cálculo.
    */

    if(
        Math.abs(diferencia) > 0.01
    ){

        return {

            correcta:false,

            distribucion:distribucion,

            total:total,

            distribuible:distribuible,

            diferencia:diferencia

        };

    }


    return {

        correcta:true,

        distribucion:distribucion,

        total:total,

        distribuible:distribuible

    };

}


/* =====================================================
   TEXTO PARA HISTORIAL
===================================================== */

function crearTextoDistribucion(distribucion){

    if(
        !distribucion ||
        distribucion.length === 0
    ){

        return "";

    }


    return (

        "Distribución - " +

        distribucion

        .map(item =>

            item.destino +

            " " +

            Number(
                item.cantidad
            ).toFixed(2)

            +

            "kg"

        )

        .join(", ")

    );

}


/* =====================================================
   FABRICAR
===================================================== */

async function fabricar(){


    const recetaId =

    document
    .getElementById("recetaSelect")
    .value;


    const cantidadFabricar =

    Number(

        document
        .getElementById("cantidadFabricar")
        .value

    );


    if(
        !recetaId ||
        !cantidadFabricar ||
        cantidadFabricar <= 0
    ){

        alert(
            "⚠️ Seleccione una receta y coloque una cantidad válida."
        );

        return;

    }



    /* ==========================================
       VALIDAR DISTRIBUCIÓN ANTES DE FABRICAR
    ========================================== */

    const resultadoDistribucion =
    validarDistribucion();


    if(
        !resultadoDistribucion.correcta
    ){

        alert(

            "⚠️ La distribución no coincide con la cantidad distribuible.\n\n"

            +

            "Cantidad distribuible: "

            +

            resultadoDistribucion.distribuible.toFixed(2)

            +

            " kg\n\n"

            +

            "Distribuido: "

            +

            resultadoDistribucion.total.toFixed(2)

            +

            " kg\n\n"

            +

            "Faltan: "

            +

            resultadoDistribucion.diferencia.toFixed(2)

            +

            " kg"

        );

        return;

    }


    const distribucion =
    resultadoDistribucion.distribucion;


    /* ==========================================
       OBTENER RECETA
    ========================================== */

    const {data:receta,error:errorReceta} =

    await clienteSupabase

    .from("recetas")

    .select("*")

    .eq("id",recetaId)

    .single();


    if(errorReceta){

        alert(
            "❌ Error obteniendo la receta:\n\n" +
            errorReceta.message
        );

        return;

    }


    recetaSeleccionada = receta;



    /* ==========================================
       OBTENER MATERIAS
    ========================================== */

    const {data:materias,error:errorMaterias} =

    await clienteSupabase

    .from("detalle_recetas")

    .select("*")

    .eq("receta_id",recetaId);


    if(errorMaterias){

        alert(
            "❌ Error obteniendo las materias primas:\n\n" +
            errorMaterias.message
        );

        return;

    }


    if(!materias || materias.length === 0){

        alert(
            "⚠️ Esta receta no tiene materias primas."
        );

        return;

    }



    /* ==========================================
       OBTENER INVENTARIO
    ========================================== */

    const {data:productos,error:errorProductos} =

    await clienteSupabase

    .from("productos")

    .select(
        "Identificación, Nombre, Unidad, Cantidad"
    );


    if(errorProductos){

        alert(
            "❌ Error leyendo el inventario:\n\n" +
            errorProductos.message
        );

        return;

    }



    /* ==========================================
       PREPARAR INVENTARIO NORMALIZADO
    ========================================== */

    const inventarioNormalizado = {};


    productos.forEach(producto=>{

        const nombreNormalizado =
        normalizar(producto.Nombre);


        inventarioNormalizado[
            nombreNormalizado
        ] = producto;

    });



    /* ==========================================
       COMPROBAR DISPONIBILIDAD
    ========================================== */

    let operaciones = [];

    let faltantes = [];


    for(const materia of materias){


        const nombreReceta =

        normalizar(
            materia.materia_prima
        );


        const cantidadNecesaria =

        (
            cantidadFabricar /
            Number(receta.cantidad_resultado)
        )

        *

        Number(materia.cantidad);


        const producto =

        inventarioNormalizado[
            nombreReceta
        ];


        if(!producto){


            faltantes.push(

                "❌ " +

                materia.materia_prima +

                "\nNo se encontró en el inventario."

            );


            continue;

        }



        const disponible =

        Number(producto.Cantidad) || 0;


        if(disponible < cantidadNecesaria){


            faltantes.push(

                "⚠️ " +

                producto.Nombre +

                "\nNecesita: " +

                cantidadNecesaria.toFixed(2) +

                " kg"

                +

                "\nDisponible: " +

                disponible.toFixed(2) +

                " kg"

            );


            continue;

        }



        operaciones.push({

            producto:producto,

            cantidad:cantidadNecesaria

        });

    }


    /* ==========================================
       AGREGAR CALCIO
    ========================================== */

    const cantidadCalcio =
    calcularCalcio(
        cantidadFabricar
    );


    const productoCalcio =

    inventarioNormalizado[
        normalizar("Calcio")
    ];


    if(!productoCalcio){

        faltantes.push(

            "❌ Calcio\nNo se encontró en el inventario."

        );

    }else{

        const disponibleCalcio =

        Number(
            productoCalcio.Cantidad
        ) || 0;


        if(
            disponibleCalcio <
            cantidadCalcio
        ){

            faltantes.push(

                "⚠️ Calcio"

                +

                "\nNecesita: "

                +

                cantidadCalcio.toFixed(2)

                +

                " kg"

                +

                "\nDisponible: "

                +

                disponibleCalcio.toFixed(2)

                +

                " kg"

            );

        }else{

            operaciones.push({

                producto:productoCalcio,

                cantidad:cantidadCalcio

            });

        }

    }


    /* ==========================================
       AGREGAR SAL
    ========================================== */

    const cantidadSal =
    calcularSal(
        cantidadFabricar
    );


    const productoSal =

    inventarioNormalizado[
        normalizar("Sal")
    ];


    if(!productoSal){

        faltantes.push(

            "❌ Sal\nNo se encontró en el inventario."

        );

    }else{

        const disponibleSal =

        Number(
            productoSal.Cantidad
        ) || 0;


        if(
            disponibleSal <
            cantidadSal
        ){

            faltantes.push(

                "⚠️ Sal"

                +

                "\nNecesita: "

                +

                cantidadSal.toFixed(2)

                +

                " kg"

                +

                "\nDisponible: "

                +

                disponibleSal.toFixed(2)

                +

                " kg"

            );

        }else{

            operaciones.push({

                producto:productoSal,

                cantidad:cantidadSal

            });

        }

    }



    /* ==========================================
       SI FALTA ALGUNA MATERIA
    ========================================== */

    if(faltantes.length > 0){

        alert(

            "🚫 NO SE PUEDE FABRICAR\n\n"

            +

            faltantes.join("\n\n")

        );

        return;

    }



    /* ==========================================
       DESCONTAR MATERIAS PRIMAS
    ========================================== */

    for(const operacion of operaciones){


        const producto =
        operacion.producto;


        const nuevaCantidad =

        Number(producto.Cantidad)

        -

        Number(operacion.cantidad);


        const {error:errorUpdate} =

        await clienteSupabase

        .from("productos")

        .update({

            Cantidad:nuevaCantidad

        })

        .eq(

            "Identificación",

            producto.Identificación

        );


        if(errorUpdate){

            alert(

                "❌ Error actualizando "

                +

                producto.Nombre

                +

                ":\n\n"

                +

                errorUpdate.message

            );

            return;

        }

    }



    /* ==========================================
       BUSCAR PRODUCTO ELABORADO
    ========================================== */

    const nombreResultado =

    String(
        receta.producto_resultado
    ).trim();


    const {data:productosElaborados,error:errorElaborados} =

    await clienteSupabase

    .from("productos_elaborados")

    .select(
        "id, Nombre, Unidad, Cantidad"
    );


    if(errorElaborados){

        alert(

            "❌ Error buscando productos elaborados:\n\n"

            +

            errorElaborados.message

        );

        return;

    }


    const elaborado =

    productosElaborados.find(p =>

        normalizar(p.Nombre)

        ===

        normalizar(nombreResultado)

    );


    if(!elaborado){

        alert(

            "❌ No se encontró el producto elaborado:\n\n"

            +

            nombreResultado

            +

            "\n\nCrea primero este producto en la receta."

        );

        return;

    }



    /* ==========================================
       AUMENTAR PRODUCCIÓN
    ========================================== */

    const nuevaProduccion =

    Number(elaborado.Cantidad)

    +

    cantidadFabricar;


    const {error:errorProduccion} =

    await clienteSupabase

    .from("productos_elaborados")

    .update({

        Cantidad:nuevaProduccion

    })

    .eq(

        "id",

        elaborado.id

    );


    if(errorProduccion){

        alert(

            "❌ Error actualizando el producto elaborado:\n\n"

            +

            errorProduccion.message

        );

        return;

    }



    /* ==========================================
       OBTENER USUARIO
    ========================================== */

    const {data:sesionData} =

    await clienteSupabase

    .auth

    .getSession();


    let usuarioActual =

    "Administrador";


    if(
        sesionData &&
        sesionData.session
    ){

        usuarioActual =

        sesionData
        .session
        .user
        .email

        ||

        "Administrador";

    }



    /* ==========================================
       TEXTO DISTRIBUCIÓN
    ========================================== */

    const textoDistribucion =

    crearTextoDistribucion(
        distribucion
    );


    /* ==========================================
       REGISTRAR FABRICACIÓN
    ========================================== */

    const {error:errorMovimiento} =

    await clienteSupabase

    .from("movimientos")

    .insert([{

        Fecha:
        new Date().toISOString(),

        Producto:
        nombreResultado,

        Tipo:
        "Fabricación",

        Cantidad:
        cantidadFabricar,

        Usuario:
        usuarioActual,

        Observación:

        "Receta: "

        +

        receta.nombre,

        "Distribución":

        textoDistribucion,

        Numero_operacion:

        "FAB-"

        +

        Date.now()

    }]);


    if(errorMovimiento){

        alert(

            "⚠️ La fabricación se realizó, pero hubo un problema registrando el historial:\n\n"

            +

            errorMovimiento.message

        );

        return;

    }



    /* ==========================================
       ÉXITO
    ========================================== */

    alert(

        "✅ FABRICACIÓN REALIZADA CORRECTAMENTE\n\n"

        +

        "🏭 Producto: "

        +

        nombreResultado

        +

        "\n\n⚖️ Cantidad fabricada: "

        +

        cantidadFabricar

        +

        " kg"

        +

        (

            textoDistribucion

            ?

            "\n\n📍 "

            +

            textoDistribucion

            :

            ""

        )

    );


    document
    .getElementById("cantidadFabricar")
    .value = "";


    document
    .getElementById("recetaSelect")
    .value = "";


    document
    .getElementById("resumen")
    .innerHTML =

    `<div class="estado">

    Seleccione una receta y la cantidad a fabricar.

    </div>`;


    document
    .getElementById("panelDistribucion")
    .style.display="none";


    recetaSeleccionada=null;

}



/* =====================================================
   INICIAR
===================================================== */

cargarRecetas();


</script>

</html>
