<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ElDesierto - Iniciar sesión</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    font-family:Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at 50% 15%,
            #3a0a0a 0%,
            #160606 35%,
            #070707 70%,
            #000000 100%
        );

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    padding:20px;

    overflow-x:hidden;
}


/* =====================================================
   BRILLO DE FONDO
===================================================== */

body::before{

    content:"";

    position:fixed;

    width:320px;
    height:320px;

    background:#d40000;

    opacity:.12;

    filter:blur(100px);

    border-radius:50%;

    top:-120px;
    left:50%;

    transform:translateX(-50%);

    pointer-events:none;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.caja{

    width:100%;
    max-width:390px;

    background:
        linear-gradient(
            145deg,
            #1c1c1c,
            #090909
        );

    border:1px solid rgba(255,40,40,.35);

    border-radius:28px;

    padding:30px 25px 28px;

    text-align:center;

    box-shadow:

        0 25px 60px rgba(0,0,0,.75),

        0 0 35px rgba(180,0,0,.18),

        inset 0 1px 0 rgba(255,255,255,.08);

    position:relative;

    overflow:hidden;
}


/* =====================================================
   LÍNEA ROJA SUPERIOR
===================================================== */

.caja::before{

    content:"";

    position:absolute;

    top:0;
    left:8%;

    width:84%;
    height:3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff1b1b,
            #ff5555,
            #ff1b1b,
            transparent
        );

    box-shadow:
        0 0 15px #ff0000;
}


/* =====================================================
   CERDITO
===================================================== */

.cerdito{

    width:150px;
    height:150px;

    margin:0 auto 5px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:105px;

    position:relative;

    filter:
        drop-shadow(0 15px 8px rgba(0,0,0,.8))
        drop-shadow(0 0 15px rgba(255,0,0,.18));

    transform:
        perspective(500px)
        rotateX(3deg);

    animation:
        cerditoFlota 3s ease-in-out infinite;
}


/* brillo detrás del cerdito */

.cerdito::before{

    content:"";

    position:absolute;

    width:115px;
    height:115px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,30,30,.28),
            transparent 70%
        );

    filter:blur(12px);

    z-index:-1;
}


/* =====================================================
   ANIMACIÓN
===================================================== */

@keyframes cerditoFlota{

    0%,100%{

        transform:
            perspective(500px)
            rotateX(3deg)
            translateY(0);
    }

    50%{

        transform:
            perspective(500px)
            rotateX(3deg)
            translateY(-7px);
    }
}


/* =====================================================
   BIENVENIDA
===================================================== */

.bienvenida{

    font-size:22px;

    font-weight:800;

    margin-top:0;

    color:white;

    text-shadow:
        0 2px 4px black,
        0 0 12px rgba(255,0,0,.35);
}

.bienvenida span{

    display:block;

    color:#ff2929;

    font-size:30px;

    margin-top:3px;

    text-shadow:
        0 0 10px rgba(255,0,0,.5),
        0 3px 5px #000;
}


/* =====================================================
   SUBTÍTULO
===================================================== */

h2{

    margin-top:32px;
    margin-bottom:22px;

    font-size:22px;

    font-weight:600;

    color:#aaa;
}


/* =====================================================
   CAMPOS
===================================================== */

.campo{

    position:relative;

    margin-bottom:15px;
}

input{

    width:100%;

    height:52px;

    padding:0 16px;

    background:#111;

    color:white;

    border:1px solid #333;

    border-radius:13px;

    outline:none;

    font-size:15px;

    transition:.25s;

    box-shadow:
        inset 0 3px 8px rgba(0,0,0,.7);
}

input::placeholder{

    color:#777;
}

input:focus{

    border-color:#e00000;

    box-shadow:

        0 0 0 2px rgba(255,0,0,.10),

        0 0 15px rgba(255,0,0,.18),

        inset 0 3px 8px rgba(0,0,0,.7);
}


/* =====================================================
   BOTÓN
===================================================== */

button{

    width:100%;

    height:54px;

    margin-top:8px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #ff2929,
            #c40000 55%,
            #7d0000
        );

    color:white;

    font-size:17px;

    font-weight:800;

    letter-spacing:.5px;

    cursor:pointer;

    box-shadow:

        0 7px 0 #560000,

        0 12px 25px rgba(0,0,0,.6),

        0 0 18px rgba(255,0,0,.22);

    transition:.15s;
}

button:hover{

    filter:brightness(1.08);
}

button:active{

    transform:translateY(5px);

    box-shadow:

        0 2px 0 #560000,

        0 6px 15px rgba(0,0,0,.6);
}


/* =====================================================
   MENSAJE
===================================================== */

#mensaje{

    min-height:22px;

    margin-top:18px;

    font-size:14px;

    font-weight:bold;

    color:#ddd;
}


/* =====================================================
   PIE
===================================================== */

.pie{

    margin-top:22px;

    font-size:11px;

    color:#555;

    letter-spacing:.5px;
}


/* =====================================================
   PANTALLAS PEQUEÑAS
===================================================== */

@media(max-height:700px){

    .caja{

        padding-top:20px;
    }

    .cerdito{

        width:115px;
        height:115px;

        font-size:80px;
    }

    h2{

        margin-top:20px;
    }
}

</style>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<div class="caja">


    <!-- CERDITO -->

    <div class="cerdito">
        🐷
    </div>


    <!-- ÚNICO NOMBRE DE LA APP -->

    <div class="bienvenida">

        Bienvenido a

        <span>ElDesierto</span>

    </div>


    <!-- INICIO DE SESIÓN -->

    <h2>
        Iniciar sesión
    </h2>


    <!-- CORREO -->

    <div class="campo">

        <input
            type="email"
            id="email"
            placeholder="Correo electrónico"
            autocomplete="username">

    </div>


    <!-- CONTRASEÑA -->

    <div class="campo">

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            autocomplete="current-password">

    </div>


    <!-- BOTÓN -->

    <button onclick="iniciarSesion()">
        Entrar
    </button>


    <!-- MENSAJE -->

    <div id="mensaje"></div>


    <!-- PIE -->

    <div class="pie">
        Sistema de gestión · ElDesierto
    </div>


</div>


<script src="supabase.js"></script>


<script>

/* =====================================================
   INICIAR SESIÓN
===================================================== */

async function iniciarSesion(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const mensaje =
        document
        .getElementById("mensaje");


    if(!email || !password){

        mensaje.innerText =
            "⚠️ Escribe el correo y la contraseña.";

        return;
    }


    mensaje.innerText =
        "⏳ Verificando...";


    /* CERRAR SESIÓN ANTERIOR */

    await clienteSupabase.auth.signOut();


    /* INICIAR SESIÓN */

    const {data,error} =
        await clienteSupabase.auth.signInWithPassword({

            email:email,

            password:password

        });


    /* ERROR */

    if(error){

        console.log(
            "ERROR LOGIN:",
            error
        );

        mensaje.innerText =
            "❌ Correo o contraseña incorrectos.";

        return;
    }


    /* VERIFICAR SESIÓN */

    if(
        !data ||
        !data.session ||
        !data.user
    ){

        mensaje.innerText =
            "❌ No se pudo iniciar la sesión.";

        return;
    }


    /* LOGIN CORRECTO */

    mensaje.innerText =
        "✅ Acceso correcto.";


    setTimeout(function(){

        window.location.replace(
            "menu.html"
        );

    },500);

}

</script>


</body>

</html>
